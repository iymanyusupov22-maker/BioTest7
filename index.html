          function shuffle(arr) {
            var copy = arr.slice();
            for (var i = copy.length - 1; i > 0; i--) {
              var j = Math.floor(Math.random() * (i + 1));
              var tmp = copy[i];
              copy[i] = copy[j];
              copy[j] = tmp;
            }
            return copy;
          }

          function buildFreshTest() {
            var topicKeys = Object.keys(TOPICS);
            var unseen = QUESTION_BANK.filter(function (q) {
              return seenIds.indexOf(q.id) === -1;
            });

            if (unseen.length < QUESTIONS_PER_TEST) {
              var prevTestIds = seenIds.slice(-QUESTIONS_PER_TEST);
              seenIds = prevTestIds.slice();
              unseen = QUESTION_BANK.filter(function (q) {
                return prevTestIds.indexOf(q.id) === -1;
              });
            }

            var selected = [];
            var selectedIds = {};

            shuffle(topicKeys).forEach(function (topic) {
              var unseenInTopic = shuffle(unseen.filter(function (q) {
                return q.topic === topic && !selectedIds[q.id];
              }));
              var fallbackInTopic = shuffle(QUESTION_BANK.filter(function (q) {
                return q.topic === topic && !selectedIds[q.id];
              }));
              var pick = unseenInTopic[0] || fallbackInTopic[0];
              if (pick) {
                selected.push(pick);
                selectedIds[pick.id] = true;
              }
            });

            shuffle(unseen.filter(function (q) { return !selectedIds[q.id]; })).forEach(function (q) {
              if (selected.length < QUESTIONS_PER_TEST) {
                selected.push(q);
                selectedIds[q.id] = true;
              }
            });

            if (selected.length < QUESTIONS_PER_TEST) {
              shuffle(QUESTION_BANK.filter(function (q) { return !selectedIds[q.id]; })).forEach(function (q) {
                if (selected.length < QUESTIONS_PER_TEST) {
                  selected.push(q);
                  selectedIds[q.id] = true;
                }
              });
            }

            var ordered = shuffle(selected);
            var sig = ordered.map(function (q) { return q.id; }).join(",");
            var guard = 0;
            while (sig === lastOrderSig && guard < 10) {
              ordered = shuffle(selected);
              sig = ordered.map(function (q) { return q.id; }).join(",");
              guard++;
            }

            seenIds = seenIds.concat(ordered.map(function (q) { return q.id; }));
            if (seenIds.length > QUESTION_BANK.length) {
              seenIds = seenIds.slice(-QUESTIONS_PER_TEST);
            }
            lastOrderSig = sig;
            safeSet("biotest_seen_ids", JSON.stringify(seenIds));
            safeSet("biotest_last_sig", lastOrderSig);

            activeQuestions = ordered.map(function (q) {
              var tagged = q.options.map(function (opt, idx) {
                var copyOpt = {};
                for (var k in opt) {
                  if (Object.prototype.hasOwnProperty.call(opt, k)) copyOpt[k] = opt[k];
                }
                copyOpt.isCorrect = idx === q.correctIndex;
                return copyOpt;
              });
              var shuffledOpts = shuffle(tagged);
              var newCorrect = 0;
              for (var i = 0; i < shuffledOpts.length; i++) {
                if (shuffledOpts[i].isCorrect) {
                  newCorrect = i;
                  break;
                }
              }
              return {
                id: q.id,
                topic: q.topic,
                q: q.q,
                correctWhy: q.correctWhy,
                highlightTrap: q.highlightTrap,
                shuffledOptions: shuffledOpts,
                shuffledCorrectIndex: newCorrect
              };
            });

            userAnswers = [];
            for (var n = 0; n < QUESTIONS_PER_TEST; n++) userAnswers.push(null);
            currentIdx = 0;
            reviewIdx = 0;
            isReviewMode = false;

            reviewView.classList.add("hidden");
            quizView.classList.remove("hidden");
            renderQuiz(true);
          }

          function applyTheme(theme) {
            currentTheme = THEME_ORDER.indexOf(theme) !== -1 ? theme : "light";
            htmlEl.setAttribute("data-theme", currentTheme);
            safeSet("biotest_theme", currentTheme);
            themeLabel.textContent = UI[currentLang].themes[currentTheme];
          }

          function applyLanguage(lang) {
            currentLang = UI[lang] ? lang : "uz";
            htmlEl.setAttribute("lang", currentLang);
            safeSet("biotest_lang", currentLang);

            for (var i = 0; i < langBtns.length; i++) {
              setClass(langBtns[i], "active", langBtns[i].getAttribute("data-lang") === currentLang);
            }

            var t = UI[currentLang];
            uiTitle.textContent = t.title;
            uiSubtitle.textContent = t.subtitle;
            themeLabel.textContent = t.themes[currentTheme];
            prevBtn.textContent = t.prev;
            reviewHeaderPill.textContent = t.reviewPill;
            restartBtn.textContent = t.restart;

            if (!activeQuestions.length) return;
            if (isReviewMode) {
              renderReviewSummary();
              renderReviewItem();
            } else {
              renderQuiz(false);
            }
          }

          function playSlide(el) {
            el.classList.remove("stage-anim");
            void el.offsetWidth;
            el.classList.add("stage-anim");
          }

          function renderQuiz(animate) {
            var q = activeQuestions[currentIdx];
            if (!q) return;
            var t = UI[currentLang];
            var topic = TOPICS[q.topic];

            topicBadge.textContent = topic.icon + " " + topic[currentLang];
            stepCounter.textContent = (currentIdx + 1) + " / " + QUESTIONS_PER_TEST;
            progressFill.style.width = (((currentIdx + 1) / QUESTIONS_PER_TEST) * 100) + "%";

            if (animate) playSlide(questionStage);

            questionText.textContent = q.q[currentLang];
            optionsList.innerHTML = "";

            q.shuffledOptions.forEach(function (opt, i) {
              var btn = document.createElement("button");
              btn.type = "button";
              btn.className = "option-btn" + (userAnswers[currentIdx] === i ? " selected" : "");

              var letterSpan = document.createElement("span");
              letterSpan.className = "option-letter";
              letterSpan.textContent = LETTERS[i];

              var textSpan = document.createElement("span");
              textSpan.textContent = opt[currentLang];

              btn.appendChild(letterSpan);
              btn.appendChild(textSpan);

              btn.addEventListener("click", function () {
                userAnswers[currentIdx] = i;
                var allBtns = optionsList.querySelectorAll(".option-btn");
                for (var k = 0; k < allBtns.length; k++) {
                  setClass(allBtns[k], "selected", k === i);
                }
                nextBtn.disabled = false;
              });
              optionsList.appendChild(btn);
            });

            prevBtn.disabled = currentIdx === 0;
            nextBtn.disabled = userAnswers[currentIdx] === null;
            nextBtn.textContent = currentIdx === QUESTIONS_PER_TEST - 1 ? t.finish : t.next;
          }

          function openReviewMode() {
            isReviewMode = true;
            reviewIdx = 0;
            quizView.classList.add("hidden");
            reviewView.classList.remove("hidden");
            renderReviewSummary();
            renderReviewItem();
            safeScrollTop();
          }

          function renderReviewSummary() {
            var t = UI[currentLang];
            var correctCount = 0;
            for (var i = 0; i < activeQuestions.length; i++) {
              if (userAnswers[i] === activeQuestions[i].shuffledCorrectIndex) correctCount++;
            }
            var pct = Math.round((correctCount / QUESTIONS_PER_TEST) * 100);

            scoreFraction.textContent = correctCount + "/" + QUESTIONS_PER_TEST;
            scorePercent.textContent = pct + "%";

            var circumference = 289;
            ringProgress.style.strokeDashoffset = circumference;
            setTimeout(function () {
              ringProgress.style.strokeDashoffset = circumference - (circumference * pct) / 100;
            }, 40);

            var tier = pct >= 80 ? "high" : pct >= 50 ? "mid" : "low";
            resultHeading.textContent = t.scores[tier][0];
            resultSubtext.textContent = t.scores[tier][1];

            reviewNavPills.innerHTML = "";
            activeQuestions.forEach(function (q, idx) {
              var isRight = userAnswers[idx] === q.shuffledCorrectIndex;
              var pill = document.createElement("button");
              pill.type = "button";
              pill.className = "nav-pill " + (isRight ? "correct" : "wrong") + (idx === reviewIdx ? " active" : "");
              pill.textContent = String(idx + 1);
              pill.addEventListener("click", function () {
                reviewIdx = idx;
                renderReviewItem();
              });
              reviewNavPills.appendChild(pill);
            });
          }

          function renderReviewItem() {
            var q = activeQuestions[reviewIdx];
            var picked = userAnswers[reviewIdx];
            var correct = q.shuffledCorrectIndex;
            var isRight = picked === correct;
            var t = UI[currentLang];
            var topic = TOPICS[q.topic];

            reviewStepCounter.textContent = (reviewIdx + 1) + " / " + QUESTIONS_PER_TEST;
            var pills = reviewNavPills.querySelectorAll(".nav-pill");
            for (var p = 0; p < pills.length; p++) {
              setClass(pills[p], "active", p === reviewIdx);
            }

            playSlide(reviewStage);
            reviewStage.innerHTML = "";

            var topicWrap = document.createElement("div");
            topicWrap.style.marginBottom = "10px";
            var topicSpan = document.createElement("span");
            topicSpan.className = "topic-pill";
            topicSpan.textContent = topic.icon + " " + topic[currentLang];
            topicWrap.appendChild(topicSpan);
            reviewStage.appendChild(topicWrap);

            var qTitle = document.createElement("h3");
            qTitle.className = "question-text";
            qTitle.style.fontSize = "1.12rem";
            qTitle.style.marginBottom = "18px";
            qTitle.textContent = q.q[currentLang];
            reviewStage.appendChild(qTitle);

            var optsWrap = document.createElement("div");
            q.shuffledOptions.forEach(function (opt, i) {
              var row = document.createElement("div");
              row.className = "review-option";
              var badgeText = "";
              var badgeClass = "";

              if (i === correct) {
                row.classList.add("is-correct");
                badgeText = t.rightChoice;
                badgeClass = "badge-ok";
              } else if (i === picked) {
                row.classList.add("is-wrong-pick");
                badgeText = t.yourChoice;
                badgeClass = "badge-err";
              } else {
                row.classList.add("dimmed");
              }

              var lSpan = document.createElement("span");
              lSpan.className = "option-letter";
              lSpan.textContent = LETTERS[i];

              var oSpan = document.createElement("span");
              oSpan.textContent = opt[currentLang];

              row.appendChild(lSpan);
              row.appendChild(oSpan);

              if (badgeText) {
                var bSpan = document.createElement("span");
                bSpan.className = "review-badge " + badgeClass;
                bSpan.textContent = badgeText;
                row.appendChild(bSpan);
              }
              optsWrap.appendChild(row);
            });
            reviewStage.appendChild(optsWrap);

            var panel = document.createElement("div");
            panel.className = "checker-panel";

            function makeBox(boxClass, titleText, bodyText) {
              var box = document.createElement("div");
              box.className = "checker-box " + boxClass;
              var titleDiv = document.createElement("div");
              titleDiv.className = "checker-box-title";
              titleDiv.textContent = titleText;
              var bodyDiv = document.createElement("div");
              bodyDiv.textContent = bodyText;
              box.appendChild(titleDiv);
              box.appendChild(bodyDiv);
              return box;
            }

            if (!isRight) {
              var pickedObj = q.shuffledOptions[picked];
              panel.appendChild(makeBox("box-wrong", "✕ " + t.wrongTitle + " (" + LETTERS[picked] + ")", pickedObj.wrong[currentLang]));
              panel.appendChild(makeBox("box-trap", "💡 " + t.trapTitle, pickedObj.trap[currentLang]));
              panel.appendChild(makeBox("box-correct", "✓ " + t.correctTitle + " (" + LETTERS[correct] + ")", q.correctWhy[currentLang]));
            } else {
              panel.appendChild(makeBox("box-correct", "✓ " + t.greatTitle + " (" + LETTERS[correct] + ")", q.correctWhy[currentLang]));
              panel.appendChild(makeBox("box-trap", "⚡ " + t.commonTrapTitle, q.highlightTrap[currentLang]));
            }

            reviewStage.appendChild(panel);
            reviewPrevBtn.disabled = reviewIdx === 0;
            reviewNextBtn.disabled = reviewIdx === QUESTIONS_PER_TEST - 1;
          }

          themeToggle.addEventListener("click", function () {
            var nextIdx = (THEME_ORDER.indexOf(currentTheme) + 1) % THEME_ORDER.length;
            applyTheme(THEME_ORDER[nextIdx]);
          });

          for (var b = 0; b < langBtns.length; b++) {
            (function (btn) {
              btn.addEventListener("click", function () {
                applyLanguage(btn.getAttribute("data-lang"));
              });
            })(langBtns[b]);
          }

          prevBtn.addEventListener("click", function () {
            if (currentIdx > 0) {
              currentIdx--;
              renderQuiz(true);
            }
          });

          nextBtn.addEventListener("click", function () {
            if (userAnswers[currentIdx] === null) return;
            if (currentIdx < QUESTIONS_PER_TEST - 1) {
              currentIdx++;
              renderQuiz(true);
            } else {
              openReviewMode();
            }
          });

          reviewPrevBtn.addEventListener("click", function () {
            if (reviewIdx > 0) {
              reviewIdx--;
              renderReviewItem();
            }
          });

          reviewNextBtn.addEventListener("click", function () {
            if (reviewIdx < QUESTIONS_PER_TEST - 1) {
              reviewIdx++;
              renderReviewItem();
            }
          });

          restartBtn.addEventListener("click", function () {
            buildFreshTest();
            safeScrollTop();
          });

          document.addEventListener("keydown", function (e) {
            if (isReviewMode) {
              if (e.key === "ArrowRight" && reviewIdx < QUESTIONS_PER_TEST - 1) {
                reviewIdx++;
                renderReviewItem();
              } else if (e.key === "ArrowLeft" && reviewIdx > 0) {
                reviewIdx--;
                renderReviewItem();
              }
              return;
            }
            var letterIdx = LETTERS.indexOf((e.key || "").toUpperCase());
            if (letterIdx !== -1) {
              var btns = optionsList.querySelectorAll(".option-btn");
              if (btns[letterIdx]) btns[letterIdx].click();
            } else if (e.key === "Enter" && !nextBtn.disabled) {
              nextBtn.click();
            }
          });

          applyTheme(currentTheme);
          applyLanguage(currentLang);
          buildFreshTest();
        } catch (err) {
          var qt = document.getElementById("questionText");
          if (qt) qt.textContent = "JS Error: " + (err && err.message ? err.message : String(err));
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
