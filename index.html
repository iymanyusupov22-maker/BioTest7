          var QUESTION_BANK = [{"id": "bac1", "topic": "bakteriyalar", "q": {"uz": "Bakteriyalar noqulay sharoitda spora hosil qiladi, lekin biologlar buni «ko‘payish usuli emas» deb ta’kidlaydi. Buning asosiy sababi nima?", "ru": "В неблагоприятных условиях бактерии образуют споры, но биологи подчёркивают, что это НЕ способ размножения. В чём главная причина?", "en": "Bacteria form spores in harsh conditions, yet biologists insist this is NOT reproduction. What is the main reason?"}, "correctIndex": 0, "correctWhy": {"uz": "Bitta bakteriya hujayrasidan faqat bitta spora hosil bo‘ladi va qulay sharoitda undan yana bitta bakteriya chiqadi — soni oshmaydi. Spora faqat tirik qolish va tarqalish uchun xizmat qiladi.", "ru": "Из одной бактериальной клетки образуется лишь одна спора, из которой потом вырастает одна бактерия — численность не увеличивается. Спора служит только для выживания и расселения.", "en": "One bacterial cell forms only one spore, which revives into one bacterium — the cell count never grows. It serves strictly for survival and dispersal."}, "highlightTrap": {"uz": "Ko‘pchilik zamburug‘ va yo‘sinlar spora bilan ko‘payishini eslab, bakteriyada ham shunday deb o‘ylaydi.", "ru": "Многие путают бактериальные споры со спорами грибов и мхов, которые действительно служат для размножения.", "en": "Students often confuse bacterial endospores with fungal or moss spores, which really are used for reproduction."}, "options": [{"uz": "Chunki bitta bakteriyadan faqat bitta spora hosil bo‘ladi va individlar soni ko‘paymaydi", "ru": "Потому что из одной бактерии образуется только одна спора и число особей не растёт", "en": "Because one bacterium forms only a single spore, so the number of cells does not increase"}, {"uz": "Chunki spora ichida bakteriyaning irsiy materiali (DNK) butunlay yo‘qolib ketadi", "ru": "Потому что внутри споры полностью разрушается наследственный материал (ДНК)", "en": "Because the bacterium’s genetic material (DNA) disappears inside a spore", "wrong": {"uz": "Aksincha, spora aynan DNKni qalin qobiq bilan o‘rab saqlab qolish uchun tuziladi.", "ru": "Наоборот: главная задача споры — надёжно защитить ДНК плотной оболочкой.", "en": "On the contrary, the entire purpose of a spore is to shield DNA inside a tough coat."}, "trap": {"uz": "Bakteriyalarda shakllangan yadro yo‘qligi haqidagi fakt ko‘pincha «DNK ham yo‘q» degan noto‘g‘ri fikrga olib keladi.", "ru": "Факт об отсутствии оформленного ядра у бактерий часто ошибочно путают с отсутствием ДНК.", "en": "Knowing bacteria lack a nucleus often tricks people into thinking they lack DNA too."}}, {"uz": "Chunki bakteriya sporalari faqat zamburug‘lar tanasida yashagandagina hosil bo‘ladi", "ru": "Потому что споры бактерий образуются только при сожительстве с грибами", "en": "Because bacterial spores can only form when living inside fungi", "wrong": {"uz": "Bakteriyalar mustaqil ravishda tuproqda, suvda yoki havoda spora hosil qila oladi.", "ru": "Бактерии самостоятельно образуют споры в почве, воде или на поверхности предметов.", "en": "Bacteria form spores independently in soil, water, or dry air."}, "trap": {"uz": "«Spora» so‘zi maktab darsligida eng ko‘p zamburug‘lar bilan birga uchragani uchun shu bog‘liqlik tanish tuyuladi.", "ru": "Слово «спора» в учебнике чаще всего связано с грибами, поэтому такая связка кажется знакомой.", "en": "Because 'spore' is heavily associated with fungi in textbooks, this connection sounds familiar."}}, {"uz": "Chunki spora hosil qilgandan so‘ng bakteriya qaytib faol hayotga qayta olmaydi", "ru": "Потому что после перехода в спору бактерия уже не может вернуться к активной жизни", "en": "Because once a bacterium becomes a spore, it can never return to active life", "wrong": {"uz": "Qulay harorat va namlik bo‘lishi bilan spora qobig‘i yorilib, bakteriya yana faol hayotga qaytadi.", "ru": "Как только возвращаются тепло и влага, оболочка разрывается и бактерия снова становится активной.", "en": "As soon as moisture and warmth return, the spore germinates right back into an active cell."}, "trap": {"uz": "Sporada moddalar almashinuvi deyarli to‘xtashi uni «o‘lgan hujayra»dek ko‘rsatishi mumkin.", "ru": "Почти полная остановка обмена веществ в споре создаёт иллюзию, будто клетка погибла.", "en": "Near-zero metabolism inside a dormant spore makes it sound as if the cell has died."}}, {"uz": "Chunki sporalar faqat kislorodsiz muhitda bo‘linib, ikkiga ajraladi", "ru": "Потому что споры делятся надвое только в бескислородной среде", "en": "Because spores only divide in two inside oxygen-free environments", "wrong": {"uz": "Spora holatidagi hujayra umuman bo‘linmaydi — u chuqur tinim davrida bo‘ladi.", "ru": "В состоянии споры клетка вообще не делится — она находится в глубоком покое.", "en": "A cell in the spore state does not divide at all; it is completely dormant."}, "trap": {"uz": "Bakteriyalar ikkiga bo‘linishi va ayrimlari anaerob ekanligi haqidagi ikki to‘g‘ri fakt ataylab aralashtirilgan.", "ru": "Здесь хитро смешаны два верных факта: деление бактерий надвое и существование анаэробов.", "en": "Two true facts (binary fission and anaerobic bacteria) were blended to sound convincing."}}]}, {"id": "bac2", "topic": "bakteriyalar", "q": {"uz": "Ayrim bakteriyalar (sianobakteriyalar) o‘simliklar kabi fotosintez qila oladi. Shunga qaramay, BARCHA bakteriyalarni bir hujayrali o‘simlik va zamburug‘lardan qat’iy ajratib turuvchi belgi qaysi?", "ru": "Некоторые бактерии (цианобактерии) способны к фотосинтезу, как растения. Какой признак всё равно строго отличает ВСЕ бактерии от одноклеточных растений и грибов?", "en": "Some bacteria (cyanobacteria) photosynthesize like plants. Which trait still strictly separates ALL bacteria from unicellular plants and fungi?"}, "correctIndex": 0, "correctWhy": {"uz": "Bakteriyalar — prokariotlar. Ularda yadro qobig‘i bo‘lmaydi, shuning uchun halqasimon DNK to‘g‘ridan-to‘g‘ri sitoplazmada joylashadi. O‘simlik va zamburug‘lar esa yadroli eukariotlardir.", "ru": "Бактерии — прокариоты: у них нет ядерной оболочки, и их ДНК свободно лежит в цитоплазме. Растения и грибы — эукариоты с оформленным ядром.", "en": "Bacteria are prokaryotes lacking a nuclear membrane, so their DNA sits freely in the cytoplasm. Plants and fungi are eukaryotes with true nuclei."}, "highlightTrap": {"uz": "Ko‘pchilik bakteriyalarda hujayra devori yo‘q yoki ribosoma bo‘lmaydi deb adashadi.", "ru": "Частая ошибка — думать, что у бактерий нет клеточной стенки или рибосом.", "en": "Many mistakenly think bacteria lack cell walls or ribosomes."}, "options": [{"uz": "Irsiy moddasi yadro qobig‘i bilan o‘ralmagan bo‘lib, sitoplazmada erkin joylashadi", "ru": "Наследственное вещество не отделено ядерной оболочкой и лежит прямо в цитоплазме", "en": "Their genetic material lacks a nuclear membrane and lies directly in the cytoplasm"}, {"uz": "Bakteriya hujayrasida umuman hujayra devori bo‘lmaydi", "ru": "У бактериальной клетки полностью отсутствует клеточная стенка", "en": "Bacterial cells completely lack a cell wall", "wrong": {"uz": "Aksariyat bakteriyalarda murein moddasidan iborat mustahkam hujayra devori bor.", "ru": "У большинства бактерий есть прочная клеточная стенка из муреина.", "en": "Most bacteria have a rigid cell wall made of peptidoglycan."}, "trap": {"uz": "Hujayra devori yo‘qligi hayvon hujayrasining belgisi, lekin sodda tuzilish deganda devor ham yo‘q deb o‘ylash oson.", "ru": "Отсутствие клеточной стенки — признак животных, но при слове «простая клетка» хочется лишить её и бактерий.", "en": "Lacking a cell wall is an animal-cell trait, yet 'simple cell' makes people guess bacteria lack it too."}}, {"uz": "Bakteriyalarda oqsil sintezlaydigan ribosomalar mavjud emas", "ru": "У бактерий отсутствуют рибосомы для синтеза белка", "en": "Bacteria have no ribosomes for building proteins", "wrong": {"uz": "Ribosomalar har qanday tirik hujayrada, jumladan barcha bakteriyalarda mavjud — oqsilsiz hayot bo‘lmaydi.", "ru": "Рибосомы есть в любой живой клетке, включая все бактерии — без белков жизнь невозможна.", "en": "Every living cell—including all bacteria—needs ribosomes to build proteins."}, "trap": {"uz": "Bakteriyalarda mitoxondriya va xloroplast yo‘qligini eslab, ribosomani ham qo‘shib yuborish juda oson.", "ru": "Зная, что у бактерий нет митохондрий и хлоропластов, легко ошибочно вычеркнуть и рибосомы.", "en": "Knowing bacteria lack mitochondria makes it easy to accidentally exclude ribosomes as well."}}, {"uz": "Bakteriyalar faqat kislorodsiz muhitda yashay oladi", "ru": "Бактерии способны жить исключительно в бескислородной среде", "en": "Bacteria can only survive in completely oxygen-free environments", "wrong": {"uz": "Kislorod bilan nafas oluvchi aerob bakteriyalar juda ko‘p; sianobakteriyalar hatto kislorod ishlab chiqaradi.", "ru": "Среди бактерий огромное число аэробов, а цианобактерии сами выделяют кислород.", "en": "Huge numbers of bacteria are aerobic, and cyanobacteria even produce oxygen."}, "trap": {"uz": "Anaerob bakteriyalar ko‘p eslatilgani uchun hamma bakteriyaga shunday deb o‘ylash mumkin.", "ru": "Из-за частого упоминания анаэробов кажется, будто кислород вреден вообще всем бактериям.", "en": "Hearing about anaerobic bacteria makes it tempting to generalize that to all bacteria."}}, {"uz": "Bakteriyalar hech qachon koloniya hosil qilmaydi va faqat yakka yashaydi", "ru": "Бактерии никогда не образуют колоний и живут строго поодиночке", "en": "Bacteria never form colonies and always live strictly as single isolated cells", "wrong": {"uz": "Streptokokk va stafilokokk kabi ko‘plab bakteriyalar zanjir va to‘da (koloniya) hosil qiladi.", "ru": "Многие бактерии (стрептококки, стафилококки) образуют устойчивые цепочки и колонии.", "en": "Many bacteria like streptococci and staphylococci live in chains and clusters."}, "trap": {"uz": "«Bir hujayrali» atamasi ko‘pincha «yolg‘iz yashovchi» degan tushuncha bilan adashtiriladi.", "ru": "Термин «одноклеточный» часто путают с «одиночным» образом жизни.", "en": "'Unicellular' is easily confused with living completely alone."}}]}, {"id": "bac3", "topic": "bakteriyalar", "q": {"uz": "Dukkakli o‘simliklar (no‘xat, loviya, beda) ekilgan yerning unumdorligi oshib, tuproq azotga boyiydi. Buning asl biologik mexanizmi qanday?", "ru": "Почва, на которой росли бобовые (горох, фасоль, клевер), становится богаче азотом. Каков настоящий биологический механизм этого явления?", "en": "Soil where legumes (peas, beans, clover) grow becomes richer in nitrogen. What is the true biological mechanism behind this?"}, "correctIndex": 0, "correctWhy": {"uz": "Dukkaklilar ildizida simbioz holda yashovchi tugunak bakteriyalar havodagi erkin azotni o‘simlik o‘zlashtira oladigan mineral tuzlarga aylantiradi.", "ru": "Симбиотические клубеньковые бактерии на корнях бобовых переводят атмосферный азот в соединения, доступные для растений.", "en": "Symbiotic root-nodule bacteria convert atmospheric nitrogen gas into nitrogen compounds that plants can absorb."}, "highlightTrap": {"uz": "Ko‘pchilik dukkakli o‘simlikning o‘zi havodan azot yutadi yoki chirituvchi bakteriyalar tirik ildizni yeydi deb adashadi.", "ru": "Главная ловушка — приписать фиксацию азота самим корням или спутать симбионтов с бактериями гниения.", "en": "The main trap is crediting the plant roots themselves or confusing symbionts with decay bacteria."}, "options": [{"uz": "Ildiz tugunaklarida yashovchi simbioz bakteriyalar havodagi azotni o‘zlashtiriladigan tuzlarga aylantiradi", "ru": "Симбиотические клубеньковые бактерии в корнях переводят азот воздуха в усвояемые соли", "en": "Symbiotic nodule bacteria in the roots convert airborne nitrogen into absorbable compounds"}, {"uz": "Dukkakli o‘simlik ildiz tukchalari havodagi sof azot gazini bakteriyalarsiz to‘g‘ridan-to‘g‘ri so‘rib oladi", "ru": "Корневые волоски бобовых сами напрямую поглощают чистый азот воздуха без участия бактерий", "en": "Legume root hairs absorb pure atmospheric nitrogen directly without any bacteria", "wrong": {"uz": "Hech bir yuksak o‘simlik havodagi erkin azot gazini mustaqil parchalab o‘zlashtira olmaydi.", "ru": "Ни одно высшее растение само не способно усваивать газообразный азот из воздуха.", "en": "No higher plant can break down and absorb pure atmospheric nitrogen gas on its own."}, "trap": {"uz": "Tuproq dukkaklilar ekilganda boyiganini ko‘rib, butun xizmatni o‘simlikning o‘ziga berish tabiiy tuyuladi.", "ru": "Поскольку почву обогащают именно бобовые, легко решить, что это заслуга самого растения.", "en": "Since legumes enrich the soil, it feels natural to give all the credit to the plant itself."}}, {"uz": "Saprofit (chirituvchi) bakteriyalar tirik loviya ildizini yeb, uni azotli o‘g‘itga aylantiradi", "ru": "Сапротрофные бактерии гниения поедают живые корни фасоли, превращая их в удобрение", "en": "Saprotrophic decay bacteria eat living bean roots and turn them into fertilizer", "wrong": {"uz": "Saprofitlar faqat o‘lik qoldiqlarni parchalaydi; tirik ildizda esa foydali simbioz kechadi.", "ru": "Сапротрофы разлагают только мёртвую органику, а на живых корнях идёт взаимовыгодный симбиоз.", "en": "Saprotrophs break down dead organic matter; living legume roots rely on mutualistic symbiosis."}, "trap": {"uz": "«Bakteriyalar tuproqni boyitadi» deganda birinchi bo‘lib chirituvchi bakteriyalar esga tushadi.", "ru": "При фразе «бактерии делают почву плодородной» первыми на ум приходят бактерии гниения.", "en": "Hearing 'bacteria enrich soil' immediately brings decomposers to mind."}}, {"uz": "Parazit bakteriyalar yer ostidagi toshlardan azotni so‘rib, o‘simlik poyasiga haydaydi", "ru": "Паразитические бактерии выкачивают азот из глубинных камней прямо в стебель", "en": "Parasitic bacteria pump nitrogen from underground rocks into the stem", "wrong": {"uz": "Tugunak bakteriyalar parazit emas (ikkalasi ham foyda ko‘radi) va azotni toshdan emas, havodan oladi.", "ru": "Клубеньковые бактерии — не паразиты (выгода взаимная), и азот они берут из воздуха, а не из камней.", "en": "Nodule bacteria are mutualists, not parasites, and they capture nitrogen from air, not rocks."}, "trap": {"uz": "Boshqa organizm ichida yashovchi har qanday bakteriyani «parazit» deb o‘ylash keng tarqalgan xato.", "ru": "Распространённое заблуждение — считать паразитом любую бактерию внутри другого организма.", "en": "It’s a common mistake to label any bacterium living inside a host as a parasite."}}, {"uz": "Dukkaklilar guli ichidagi bakteriyalar yomg‘ir bilan barglarga azot kislotasi purkaydi", "ru": "Бактерии внутри цветков бобовых распыляют азотную кислоту на листья во время дождя", "en": "Bacteria inside legume flowers spray nitric acid onto the leaves during rain", "wrong": {"uz": "Azot to‘plash ildiz tugunaklarida kechadi, azot kislotasi esa barglarni kuydirib yuborgan bo‘lar edi.", "ru": "Фиксация азота идёт в корневых клубеньках, а азотная кислота просто сожгла бы листья.", "en": "Nitrogen fixation happens in root nodules, and nitric acid would burn the leaves."}, "trap": {"uz": "Momaqaldiroq va yomg‘ir bilan tuproqqa ozroq azot tushishi haqidagi fakt bu variantni haqiqatga o‘xshatadi.", "ru": "Знание о том, что при грозе в воздухе образуются соединения азота, делает вариант с дождём правдоподобным.", "en": "Knowing lightning and rain can add trace nitrogen makes the rain option sound vaguely plausible."}}]}, {"id": "mus1", "topic": "mushak", "q": {"uz": "Odam qo‘lini xohlagan paytda to‘xtata oladi, lekin oshqozon devorining qisqarishini yoki yurak urishini irodasi bilan to‘xtata olmaydi. Buning eng aniq izohi qaysi?", "ru": "Человек может усилием воли остановить движение руки, но не может так же остановить сокращения желудка или сердца. Какое объяснение самое точное?", "en": "A person can voluntarily stop moving their arm, but cannot consciously stop stomach contractions or their heartbeat. What is the most accurate explanation?"}, "correctIndex": 0, "correctWhy": {"uz": "Qo‘l mushaklari — ixtiyoriy boshqariluvchi ko‘ndalang-targ‘il skelet mushaklari. Oshqozon (silliq) va yurak mushaklari esa ixtiyorsiz (avtonom) ishlaydi.", "ru": "Мышцы руки — произвольные скелетные, управляемые сознанием. Гладкие мышцы желудка и сердечная мышца работают непроизвольно.", "en": "Arm muscles are voluntary striated skeletal muscles, whereas stomach (smooth) and cardiac muscles are involuntary."}, "highlightTrap": {"uz": "Ko‘pchilik ichki organlarda nerv tolalari umuman yo‘q yoki silliq mushak juda tez ishlaydi deb o‘ylaydi.", "ru": "Многие думают, что к внутренним органам не подходят нервы или что гладкие мышцы слишком быстрые.", "en": "Many assume internal organs have no nerves or that smooth muscles move too fast to control."}, "options": [{"uz": "Qo‘l mushagi ixtiyoriy boshqariluvchi skelet mushagi, oshqozon va yurak esa ixtiyorsiz ishlovchi mushak to‘qimalaridan tuzilgan", "ru": "В руке — произвольная скелетная мускулатура, а в желудке и сердце — непроизвольные мышечные ткани", "en": "Arms use voluntary skeletal muscle, while the stomach and heart use involuntary muscle tissues"}, {"uz": "Oshqozon va yurak mushaklariga bosh miyadan hech qanday nerv tolalari bormaydi", "ru": "К мышцам желудка и сердца вообще не подходят нервные волокна от мозга", "en": "No nerve fibers connect the brain to the stomach or heart muscles", "wrong": {"uz": "Ularga vegetativ (avtonom) nervlar boradi — masalan, qo‘rqqanda yurak tez urishi aynan nerv signallari natijasidir.", "ru": "К ним подходят вегетативные нервы: например, сердцебиение от страха ускоряется именно по сигналу нервов.", "en": "Autonomic nerves connect to them—that’s why fear instantly speeds up your heartbeat."}, "trap": {"uz": "«Ongim bilan boshqara olmayman» degan gap beixtiyor «miya bilan aloqasi yo‘q» degan xulosaga olib boradi.", "ru": "Фраза «не подчиняется сознанию» легко превращается в ложную мысль «нет связи с мозгом».", "en": "'Not under conscious control' easily gets mistaken for 'disconnected from the brain.'"}}, {"uz": "Silliq mushaklar skelet mushaklariga qaraganda ancha tez qisqargani uchun miya ularga ulgurmaydi", "ru": "Гладкие мышцы сокращаются гораздо быстрее скелетных, поэтому мозг не успевает ими управлять", "en": "Smooth muscles contract far faster than skeletal muscles, so the brain cannot keep up", "wrong": {"uz": "Aksincha, silliq mushaklar juda sekin qisqaradi va uzoq vaqt charchamasdan ishlaydi.", "ru": "Всё наоборот: гладкие мышцы сокращаются очень медленно, но зато почти не устают.", "en": "It’s the opposite: smooth muscles contract very slowly and resist fatigue."}, "trap": {"uz": "«Nazorat qilib bo‘lmaydi» deyilganda odam ko‘pincha juda tez jarayonni tasavvur qiladi.", "ru": "Слово «неконтролируемый» психологически ассоциируется с чем-то слишком быстрым.", "en": "'Uncontrollable' psychologically makes people picture something moving too fast."}}, {"uz": "Qo‘l mushaklari suyakni ham itarib, ham tortib harakatlantiradi, ichki organlar esa faqat tortadi", "ru": "Мышцы руки умеют и толкать, и тянуть кость, а мышцы органов — только тянуть", "en": "Arm muscles can both push and pull bones, whereas organ muscles can only pull", "wrong": {"uz": "Hech bir mushak itara olmaydi! Barcha mushaklar faqat qisqarib (tortib) ishlaydi.", "ru": "Ни одна мышца не умеет толкать! Любая мышца способна только сокращаться (тянуть).", "en": "No muscle can push! Every muscle works strictly by contracting (pulling)."}, "trap": {"uz": "Qo‘l bilan eshik itarganimizda mushak ham itaryaptidek tuyuladi, aslida u suyakni qarama-qarshi tomondan tortadi.", "ru": "Когда мы толкаем дверь рукой, кажется, что мышца «толкает», хотя внутри она лишь тянет кость.", "en": "Because our arm pushes objects, it feels like muscles push—when opposing muscles actually pull."}}, {"uz": "Yurak va oshqozon mushaklarida qon tomirlari yo‘qligi sababli ular mustaqil harakatlanadi", "ru": "В мышцах сердца и желудка нет кровеносных сосудов, поэтому они работают автономно", "en": "Heart and stomach muscles lack blood vessels, allowing them to work independently", "wrong": {"uz": "Yurak mushagi tanadagi eng ko‘p qon va kislorod oladigan mushaklardan biridir (koronar tomirlar orqali).", "ru": "Сердечная мышца — одна из самых богато кровоснабжаемых в организме.", "en": "Heart muscle has one of the richest blood supplies in the entire body."}, "trap": {"uz": "Yurak ichidan qon oqib o‘tishi uni alohida qon tomirlariga muhtoj emasdek ko‘rsatishi mumkin.", "ru": "То, что сердце качает кровь внутри камер, создаёт ложное ощущение, будто ему не нужны свои сосуды.", "en": "Because blood flows through heart chambers, people forget the heart wall needs its own vessels."}}]}, {"id": "mus2", "topic": "mushak", "q": {"uz": "Qo‘lingizni tirsakdan bukayotgan paytda yelkadagi ikki boshli (biseps) va uch boshli (triseps) mushaklarda aniq nima sodir bo‘ladi?", "ru": "Что именно происходит с бицепсом (двуглавой) и трицепсом (трёхглавой мышцей) плеча в момент, когда вы сгибаете руку в локте?", "en": "What precisely happens to the biceps and triceps muscles when you bend your arm at the elbow?"}, "correctIndex": 0, "correctWhy": {"uz": "Biseps va triseps — antagonist mushaklar. Qo‘lni bukganda biseps qisqarib kaltayadi va bilakni tortadi, triseps esa bo‘shashib cho‘ziladi.", "ru": "Бицепс и трицепс — антагонисты. При сгибании бицепс сокращается (укорачивается и тянет предплечье), а трицепс расслабляется и растягивается.", "en": "Biceps and triceps are antagonistic muscles: the biceps contracts and shortens to pull the forearm, while the triceps relaxes and lengthens."}, "highlightTrap": {"uz": "Eng ko‘p uchraydigan xato — biseps cho‘zilib tortadi yoki ikkala mushak bir vaqtda teng qisqaradi deb o‘ylash.", "ru": "Частая ошибка — думать, что бицепс растягивается при сгибании или что обе мышцы сокращаются одинаково.", "en": "Common traps are thinking the biceps stretches to pull or that both muscles contract equally."}, "options": [{"uz": "Ikki boshli mushak qisqarib kaltayadi, uch boshli mushak esa bo‘shashib cho‘ziladi", "ru": "Бицепс сокращается и укорачивается, а трицепс расслабляется и растягивается", "en": "The biceps contracts and shortens while the triceps relaxes and stretches"}, {"uz": "Ikki boshli mushak cho‘zilib bilakni tortadi, uch boshli mushak esa qisqarib uni itaradi", "ru": "Бицепс растягивается, чтобы подтянуть руку, а трицепс сокращается, чтобы подтолкнуть её", "en": "The biceps stretches to pull the forearm while the triceps contracts to push it", "wrong": {"uz": "Mushak cho‘zilganda kuch hosil qilmaydi va hech qachon itarmaydi — faqat qisqarib tortadi.", "ru": "При растяжении мышца не тянет, а при сокращении не толкает — здесь всё перепутано местами.", "en": "Stretching is passive relaxation, and contracting pulls rather than pushes."}, "trap": {"uz": "Bukish paytida biseps shishib kattalashgani uchun uni «cho‘zildi» deb o‘ylash oson, aslida uzunligi kaltayadi.", "ru": "Видя, как бицепс увеличивается в объёме, легко назвать это «растяжением», хотя в длину он укорачивается.", "en": "Seeing the biceps bulge makes it easy to think it lengthened, when it actually shortened and thickened."}}, {"uz": "Harakat tekis bo‘lishi uchun biseps ham, triseps ham bir xil kuch bilan qisqaradi", "ru": "Для плавного движения и бицепс, и трицепс сокращаются с одинаковой силой", "en": "Both biceps and triceps contract with equal force so the movement stays smooth", "wrong": {"uz": "Agar ikkalasi teng kuch bilan qisqarsa, tirsak bo‘g‘imi qotib qoladi va qo‘l bukilmaydi.", "ru": "Если обе мышцы сократятся с равной силой, сустав просто заблокируется на месте.", "en": "If both pulled with equal force, the elbow would lock completely immobile."}, "trap": {"uz": "Og‘ir yuk ko‘targanda butun qo‘l taranglashgani ikkala mushak bir xil ishlayotgandek taassurot beradi.", "ru": "При подъёме тяжести вся рука ощущается напряжённой, что создаёт иллюзию равного сокращения.", "en": "Your whole arm feels tense when lifting weight, creating the illusion both muscles contract equally."}}, {"uz": "Faqat biseps suyakka pay bilan birikkan, triseps esa faqat teriga birikkan", "ru": "Только бицепс прикреплён сухожилиями к кости, а трицепс крепится лишь к коже", "en": "Only the biceps attaches to bone via tendons; the triceps attaches only to skin", "wrong": {"uz": "Ikkala mushak ham paylar orqali suyakka birikadi; teriga esa yuzdagi mimika mushaklari birikadi.", "ru": "Обе мышцы крепятся к костям сухожилиями; к коже крепятся мимические мышцы лица.", "en": "Both attach to bones via tendons; facial expression muscles are the ones attached to skin."}, "trap": {"uz": "Darslikdagi «ayrim mushaklar teriga birikadi» degan fakt bu yerda ataylab qo‘l mushagiga ko‘chirilgan.", "ru": "Факт из учебника о мышцах, крепящихся к коже, здесь специально перенесён на руку.", "en": "A real textbook fact about facial muscles was deliberately transplanted onto the arm."}}, {"uz": "Biseps qisqarganda yelka suyagi egilib, bilakni o‘ziga yaqinlashtiradi", "ru": "При сокращении бицепса плечевая кость сгибается дугой, приближая предплечье", "en": "When the biceps contracts, the humerus bone bends like a bow to lift the forearm", "wrong": {"uz": "Suyaklar egilmaydi — harakat ikki suyak tutashgan tirsak bo‘g‘imida sodir bo‘ladi.", "ru": "Кости не гнутся — движение происходит в локтевом суставе, как на шарнире.", "en": "Bones stay rigid; the bending happens strictly at the elbow joint hinge."}, "trap": {"uz": "Suyakda elastik organik modda borligini eslab, uni sezilarli egiladi deb o‘ylash mumkin.", "ru": "Память об эластичности органики в кости может заставить поверить в её заметный изгиб.", "en": "Remembering bones have organic flexibility can trick you into thinking they visibly bend."}}]}, {"id": "mus3", "topic": "mushak", "q": {"uz": "Tez va uzoq yugurgandan so‘ng mushaklarda charchoq hamda achishish paydo bo‘ladi. Bu holatning asosiy fiziologik sababi qaysi?", "ru": "После быстрого и долгого бега в мышцах появляются усталость и жжение. Какая физиологическая причина объясняет это точнее всего?", "en": "After intense sprinting, muscles fatigue rapidly and feel a burning sensation. Which physiological explanation is most accurate?"}, "correctIndex": 0, "correctWhy": {"uz": "Kislorod tanqisligida glyukoza chala parchalanib sut kislotasi to‘planadi, energiya zaxirasi kamayadi va nerv markazlari ham charchaydi.", "ru": "При нехватке кислорода в мышцах накапливается молочная кислота, истощаются запасы энергии, а также утомляются нервные центры.", "en": "Under oxygen deficit, lactic acid builds up, energy reserves deplete, and nerve signals also fatigue."}, "highlightTrap": {"uz": "Ko‘pchilik yugurganda oyoqlarga qon borishi to‘xtaydi yoki karbonat angidrid tugab qoladi deb chalg‘iydi.", "ru": "Частые ловушки: путаница между кислородом и углекислым газом или миф о перекрытии кровотока.", "en": "Common traps include swapping oxygen with carbon dioxide or thinking blood flow shuts down."}, "options": [{"uz": "Kislorod tanqisligi tufayli sut kislotasi to‘planishi, energiya zaxirasi kamayishi va nerv charchashi", "ru": "Накопление молочной кислоты из-за нехватки кислорода, расход запасов энергии и утомление нервных центров", "en": "Lactic acid buildup from oxygen deficit, depletion of energy reserves, and neural fatigue"}, {"uz": "Yugurish paytida miyani asrash uchun oyoq mushaklariga qon kelishi butunlay to‘xtatiladi", "ru": "Во время бега кровоток к ногам полностью перекрывается, чтобы сберечь кислород для мозга", "en": "Blood flow to the legs shuts off completely during running to save oxygen for the brain", "wrong": {"uz": "Aksincha, yugurganda ishlayotgan mushaklarga qon oqimi bir necha barobar kuchayadi.", "ru": "Напротив: при нагрузке приток крови к работающим мышцам усиливается в несколько раз.", "en": "The opposite happens—blood flow to working muscles multiplies dramatically during exercise."}, "trap": {"uz": "«Kislorod yetishmaydi» degan gap qon kelmay qoldi degan noto‘g‘ri taxminga olib kelishi mumkin.", "ru": "Фраза «не хватает кислорода» заставляет ошибочно предположить, что кровь перестала поступать.", "en": "Hearing 'oxygen shortage' makes it sound as if blood stopped reaching the muscles."}}, {"uz": "Mushak qisqarishi uchun zarur bo‘lgan karbonat angidrid gazi tugab qoladi", "ru": "В мышцах заканчивается углекислый газ, необходимый им для сокращения", "en": "The muscles run out of carbon dioxide needed to power contraction", "wrong": {"uz": "Karbonat angidrid yoqilg‘i emas, chiqindi gazdir; mushakka energiya olish uchun kislorod kerak.", "ru": "Углекислый газ — это отход дыхания, а не топливо; для окисления веществ нужен кислород.", "en": "Carbon dioxide is a waste product, not fuel; oxygen is needed for aerobic energy."}, "trap": {"uz": "Tez o‘qiganda nafas olishdagi ikki gazni (kislorod va karbonat angidrid) adashtirish juda oson.", "ru": "При быстром чтении два дыхательных газа легко перепутать местами.", "en": "Skimming fast makes it super easy to swap oxygen and carbon dioxide."}}, {"uz": "Har safar tez yugurganda suyak paylari uzilib, qaytadan bitadi", "ru": "При каждом быстром беге сухожилия надрываются, а затем срастаются заново", "en": "Tendons tear slightly every time you sprint and then heal back", "wrong": {"uz": "Pay uzilishi — og‘ir jarohat bo‘lib, oddiy charchoqning sababi emas.", "ru": "Надрыв сухожилия — серьёзная травма, а не причина обычного утомления.", "en": "Tearing a tendon is a serious injury, not the mechanism behind everyday fatigue."}, "trap": {"uz": "Mashqdan keyingi «mikro-yirtilishlar» haqidagi gap mushak tolalariga tegishli, paylarga emas.", "ru": "Слыша про «микротравмы» после тренировок, легко перепутать мышечные волокна с сухожилиями.", "en": "Hearing about workout micro-tears makes people confuse muscle fibers with tendons."}}, {"uz": "Suyaklar yugurish paytida mushaklardagi barcha oqsillarni o‘ziga tortib oladi", "ru": "Во время бега кости забирают белки из мышц для собственной прочности", "en": "Bones pull proteins out of muscles during running to reinforce themselves", "wrong": {"uz": "Suyaklar mushakdan oqsil tortib olmaydi; charchoq energiya va moddalar almashinuvi bilan bog‘liq.", "ru": "Кости не вытягивают белки из мышц; утомление связано с обменом веществ и энергией.", "en": "Bones never drain proteins from muscles; fatigue is driven by metabolism."}, "trap": {"uz": "Suyak va mushak doim birga ishlagani uchun shunday almashinuv bordek tuyulishi mumkin.", "ru": "Тесная связь костей и мышц создаёт ложное ощущение такого обмена.", "en": "Because bones and muscles work closely together, this sounds deceptively plausible."}}]}, {"id": "bone1", "topic": "suyak", "q": {"uz": "Agar toza suyakni bir necha kun kuchsiz xlorid kislota (yoki sirka) eritmasiga solib qo‘ysak, u yumshab, hatto tugun qilib bog‘lasa bo‘ladigan darajada egiluvchan bo‘lib qoladi. Nega?", "ru": "Если подержать кость несколько дней в слабом растворе соляной кислоты (или уксуса), она станет настолько гибкой, что её можно завязать в узел. Почему?", "en": "If you soak a bone in weak hydrochloric acid (or vinegar) for several days, it becomes soft enough to tie in a knot. Why?"}, "correctIndex": 0, "correctWhy": {"uz": "Kislota suyakka qattiqlik beruvchi noorganik mineral tuzlarni (kalsiy va fosfor birikmalarini) eritib yuboradi, natijada egiluvchanlik beruvchi organik modda (ossein) qoladi.", "ru": "Кислота растворяет неорганические минеральные соли (кальций, фосфор), отвечающие за твёрдость, и остаётся гибкое органическое вещество (оссеин).", "en": "The acid dissolves the hard inorganic mineral salts (calcium and phosphorus), leaving behind the flexible organic matrix (ossein)."}, "highlightTrap": {"uz": "Kislota tajribasi (tuzlar eriydi → egiluvchan) bilan olovda kuydirishni (organika yonadi → mo‘rt) almashtirish — №1 tuzoq!", "ru": "Ловушка №1 — перепутать опыт с кислотой (удаляет соли → гибкость) и прокаливание на огне (сжигает органику → хрупкость).", "en": "The #1 trap is swapping the acid experiment (removes minerals → flexible) with burning (removes organics → brittle)."}, "options": [{"uz": "Kislota qattiqlik beruvchi mineral tuzlarni eritib yuboradi va egiluvchan organik moddalar qoladi", "ru": "Кислота растворяет придающие твёрдость минеральные соли, оставляя упругую органику", "en": "Acid dissolves the hardening mineral salts, leaving flexible organic matter behind"}, {"uz": "Kislota organik oqsillarni kuydirib yuboradi, qolgan mineral tuzlar esa yumshoq bo‘ladi", "ru": "Кислота разрушает органические белки, а оставшиеся минеральные соли становятся мягкими", "en": "Acid destroys organic proteins, and the remaining mineral salts are soft", "wrong": {"uz": "Organik modda yo‘qolsa (olovda kuydirilganda), suyak yumshoq emas, aksincha mo‘rt bo‘lib uvalanib ketadi.", "ru": "При удалении органики (прокаливании) кость не гнётся, а становится хрупкой и рассыпается в прах.", "en": "Removing organic matter makes bone brittle and crumbly, never bendable."}, "trap": {"uz": "«Kislota kuydiradi» degan kundalik tasavvur organik modda eriydi degan teskari xulosaga yetaklaydi.", "ru": "Бытовое представление «кислота разъедает живое/органику» толкает выбрать ровно обратный ответ.", "en": "Everyday intuition says 'acid burns organics,' tricking you into picking the exact opposite."}}, {"uz": "Suyak ichidagi sariq ilik erib, butun suyakni rezinasimon moddaga aylantiradi", "ru": "Жёлтый костный мозг внутри плавится и превращает всю кость в резиноподобную массу", "en": "Yellow bone marrow melts and turns the entire bone into a rubbery substance", "wrong": {"uz": "Sariq ilik asosan yog‘dan iborat bo‘lib, qattiq suyak devorining kimyoviy tarkibini o‘zgartira olmaydi.", "ru": "Жёлтый мозг — это жировая ткань внутри полости, она не делает стенку кости эластичной.", "en": "Yellow marrow is mostly fat inside the shaft; it doesn’t make solid bone walls flexible."}, "trap": {"uz": "Ilik yumshoq bo‘lgani uchun suyakning yumshashini ichkaridagi ilik bilan bog‘lash oson.", "ru": "Поскольку костный мозг мягкий, кажется логичным связать мягкость кости именно с ним.", "en": "Because marrow is soft, it’s tempting to blame the bone’s softness on marrow."}}, {"uz": "Suv suyak g‘ovaklarini to‘ldirib, uni gubkadek yumshoq qilib qo‘yadi", "ru": "Вода пропитывает поры кости, делая её мягкой, как губка", "en": "Water saturates the bone’s pores, making it soft like a wet sponge", "wrong": {"uz": "Oddiy suvda suyak oylab tursa ham egilmaydi — buning uchun aynan kislotaning tuzlar bilan reaksiyasi shart.", "ru": "В обычной воде кость останется твёрдой — нужна именно химическая реакция кислоты с солями кальция.", "en": "Plain water leaves a bone rigid; you need acid to dissolve calcium salts."}, "trap": {"uz": "Ko‘p qattiq narsalar suvda yumshagani uchun buni oddiy ivish deb o‘ylash mumkin.", "ru": "В быту многие твёрдые вещи размокают в воде, поэтому легко недооценить роль кислоты.", "en": "Many rigid items soften in water, making it easy to overlook the acid’s chemical role."}}, {"uz": "Kislota suyak hujayralarini tirik tog‘ay hujayralariga aylantirib qo‘yadi", "ru": "Кислота превращает костные клетки в живые хрящевые клетки", "en": "Acid transforms bone cells into living cartilage cells", "wrong": {"uz": "Kislota bir to‘qimani boshqa tirik to‘qimaga aylantira olmaydi; tajribadagi suyak o‘lik to‘qimadir.", "ru": "Кислота не способна превращать один вид ткани в другой, тем более в неживой кости.", "en": "Acid cannot convert one tissue type into another—especially in a non-living bone."}, "trap": {"uz": "Tog‘ay egiluvchan bo‘lgani uchun «suyak tog‘ayga aylanib qoldi» degan fikr tanish tuyuladi.", "ru": "Хрящ действительно гибкий, поэтому идея «кость стала хрящом» звучит заманчиво.", "en": "Since cartilage is flexible, saying the bone 'turned into cartilage' sounds oddly tempting."}}]}, {"id": "bone2", "topic": "suyak", "q": {"uz": "O‘smir yoshida naysimon suyaklar (masalan, son suyagi) BO‘YIGA va ENIGA qaysi tuzilmalar hisobiga o‘sadi?", "ru": "За счёт каких именно структур длинные трубчатые кости подростка растут в ДЛИНУ и в ТОЛЩИНУ?", "en": "Which specific structures allow a teenager’s long tubular bones (like the femur) to grow in LENGTH versus in THICKNESS?"}, "correctIndex": 0, "correctWhy": {"uz": "Suyaklar uchlaridagi tog‘ay qatlamlari hujayralari bo‘linishi hisobiga BO‘YIGA, tashqi suyak usti pardasi (periost) ichki qavati hisobiga esa ENIGA o‘sadi.", "ru": "В длину кости растут за счёт деления клеток хрящевых прослоек на концах, а в толщину — за счёт внутреннего слоя надкостницы.", "en": "Bones grow in length via dividing cartilage plates near the ends, and in thickness via the inner layer of the periosteum."}, "highlightTrap": {"uz": "Klassik tuzoq — bo‘yiga va eniga o‘sishga javobgar qismlarni teskari almashtirib qo‘yish yoki qizil ilikni tanlash.", "ru": "Классическая ловушка — перепутать местами хрящ и надкостницу или приписать рост костному мозгу.", "en": "Classic trap: swapping cartilage and periosteum, or giving credit to bone marrow."}, "options": [{"uz": "Bo‘yiga — uchlaridagi tog‘ay qatlamlari hisobiga; eniga — suyak usti pardasi (periost) hisobiga", "ru": "В длину — за счёт хрящевых прослоек на концах; в толщину — за счёт надкостницы", "en": "In length via cartilage plates at the ends; in thickness via the periosteum"}, {"uz": "Bo‘yiga — suyak usti pardasi hisobiga; eniga — uchlaridagi tog‘ay qatlamlari hisobiga", "ru": "В длину — за счёт надкостницы; в толщину — за счёт хрящевых прослоек", "en": "In length via the periosteum; in thickness via cartilage plates at the ends", "wrong": {"uz": "Vazifalar teskari yozilgan: parda suyakni tashqaridan o‘ragani uchun eniga qalinlashtiradi, uchlardagi tog‘ay esa uzunlashtiradi.", "ru": "Функции перепутаны местами: надкостница покрывает кость снаружи (даёт толщину), а хрящ на концах вытягивает её в длину.", "en": "The roles are reversed: the outer periosteum adds width, while end-plate cartilage adds length."}, "trap": {"uz": "Ikkala atama ham to‘g‘ri va tanish bo‘lgani uchun shoshilganda tartibini adashtirish oson.", "ru": "Оба термина правильные и знакомые, поэтому при беглом чтении легко не заметить перестановку.", "en": "Both terms are right and familiar, making it super easy to miss that they are flipped."}}, {"uz": "Bo‘yiga ham, eniga ham faqat ichkaridagi qizil suyak iligi hisobiga o‘sadi", "ru": "И в длину, и в толщину кость растёт исключительно за счёт красного костного мозга", "en": "Both length and thickness come strictly from the red bone marrow inside", "wrong": {"uz": "Qizil suyak iligi qon hujayralarini ishlab chiqaradi, suyak o‘lchamini kattalashtirmaydi.", "ru": "Красный костный мозг — орган кроветворения, он создаёт клетки крови, а не удлиняет кость.", "en": "Red bone marrow produces blood cells; it does not elongate or thicken bone shafts."}, "trap": {"uz": "Qizil ilikda hujayralar faol bo‘linishini bilib, uni suyak o‘sishiga ham bog‘lash oson.", "ru": "Зная, что в красном мозге активно делятся клетки, легко ошибочно приписать ему рост самой кости.", "en": "Knowing red marrow has dividing cells makes it easy to assume it grows the bone too."}}, {"uz": "Sariq suyak iligi suyak devorini ichkaridan kengaytirib, uni cho‘zadi", "ru": "Жёлтый костный мозг распирает стенки кости изнутри, вытягивая её", "en": "Yellow bone marrow expands inside the hollow shaft to stretch the bone", "wrong": {"uz": "Sariq ilik zaxira yog‘ to‘qimasidir; u bosim berib qattiq suyakni cho‘za olmaydi.", "ru": "Жёлтый мозг — это запас жира; он не способен механически растягивать твёрдую кость.", "en": "Yellow marrow is stored fat tissue and cannot physically stretch solid bone."}, "trap": {"uz": "Naysimon suyakning markazi sariq ilik bilan to‘lganini bilish uni o‘sish manbaidek ko‘rsatishi mumkin.", "ru": "Расположение жёлтого мозга прямо в центре трубчатой кости создаёт иллюзию его главной роли в росте.", "en": "Seeing yellow marrow fill the center of long bones makes it seem like the engine of growth."}}, {"uz": "Suyaklar 7 yoshdan keyin eniga o‘sishdan to‘xtaydi va 25 yoshgacha faqat bo‘yiga cho‘ziladi", "ru": "После 7 лет кости перестают расти в толщину и до 25 лет вытягиваются только в длину", "en": "Bones stop thickening after age 7 and only lengthen until age 25", "wrong": {"uz": "Suyaklar o‘smirlikda bo‘yiga ham, eniga ham o‘sadi; periost esa singan suyakni bitirish uchun butun umr faol qoladi.", "ru": "Кости утолщаются на протяжении всего роста, а надкостница сохраняет способность к делению всю жизнь.", "en": "Bones thicken throughout adolescence, and the periosteum stays active for fracture healing in adults."}, "trap": {"uz": "«25 yoshgacha o‘sish» degan haqiqiy raqam bu noto‘g‘ri jumlaga ishonchli ko‘rinish beradi.", "ru": "Реальный факт про рост до ~25 лет придаёт этому неверному утверждению вид истины.", "en": "The real fact about growth continuing into one's 20s makes the false half sound believable."}}]}, {"id": "bone3", "topic": "suyak", "q": {"uz": "Odamning son suyagi tik turganda 1,5 tonnagacha bosimga bardosh bera oladi, ammo o‘zi juda yengil. Qaysi tuzilish xususiyati bu ikki sifatni birlashtiradi?", "ru": "Бедренная кость человека выдерживает вертикальную нагрузку до 1,5 тонн, оставаясь при этом лёгкой. Какая особенность строения даёт такое сочетание?", "en": "The human femur withstands up to 1.5 tons of vertical compression while staying light. Which structural design achieves both?"}, "correctIndex": 0, "correctWhy": {"uz": "Zich moddadan tuzilgan ichi bo‘sh naycha shakli minimal og‘irlikda maksimal mustahkamlik beradi, uchlaridagi g‘ovak plastinkalar esa yuklama chiziqlari bo‘ylab joylashadi.", "ru": "Полая трубчатая форма из компактного вещества даёт максимум прочности при минимуме веса, а перекладины губчатого вещества идут точно по линиям нагрузки.", "en": "A hollow compact-bone cylinder maximizes strength-to-weight ratio, while spongy bone struts at the ends align along stress lines."}, "highlightTrap": {"uz": "Ko‘pchilik odam suyaklari qushlarnikidek havo bilan to‘lgan yoki butunlay yaxlit toshdek zich deb o‘ylaydi.", "ru": "Ловушка — спутать трубчатые кости человека с воздухоносными костями птиц или подумать, что сплошной стержень лучше.", "en": "The trap is confusing human marrow-filled hollow bones with birds’ air-filled bones, or assuming solid is better."}, "options": [{"uz": "Zich moddali ichi bo‘sh naycha shakli va uchlaridagi yuklama yo‘nalishida joylashgan g‘ovak plastinkalar", "ru": "Полая трубчатая форма из компактного вещества и перекладины губчатого вещества по линиям нагрузки", "en": "A hollow compact-bone tube paired with spongy bone struts aligned along stress lines"}, {"uz": "Odamning uzun suyaklari qushlarnikiga o‘xshab bosimli havo bilan to‘ldirilgan", "ru": "Длинные кости человека, как и у птиц, заполнены сжатым воздухом", "en": "Human long bones are filled with pressurized air just like in birds", "wrong": {"uz": "Havo bilan to‘lgan suyaklar qushlarga xos; odamning naysimon suyak bo‘shlig‘ida suyak iligi joylashadi.", "ru": "Воздухоносные кости характерны для птиц; полость трубчатых костей человека заполнена костным мозгом.", "en": "Air-filled bones belong to birds; human long-bone cavities are filled with marrow."}, "trap": {"uz": "«Ichi bo‘sh» iborasini eshitganda ko‘pchilik ichkarida faqat havo bor deb o‘ylaydi.", "ru": "Услышав «полая кость», легко представить, что внутри именно воздух, как у птиц.", "en": "Hearing 'hollow bone' immediately makes people picture empty air inside."}}, {"uz": "Ular ichida hech qanday bo‘shliqsiz, butunlay yaxlit zich suyak ustunidan iborat", "ru": "Они представляют собой полностью сплошной плотный стержень без каких-либо полостей", "en": "They are completely solid, dense rods with no internal cavities at all", "wrong": {"uz": "Yaxlit suyak juda og‘ir bo‘lib ketar edi; naycha shakli bir xil og‘irlikda egilishga ancha chidamli.", "ru": "Сплошная кость была бы слишком тяжёлой; трубчатая конструкция при том же весе прочнее на изгиб.", "en": "A solid bone would be far too heavy; hollow tubes offer much better bending strength per gram."}, "trap": {"uz": "1,5 tonna yuklama haqidagi raqam «demak u yaxlit monolit» degan fikrni uyg‘otadi.", "ru": "Цифра в 1,5 тонны заставляет думать, что такую прочность даст только сплошной монолит.", "en": "Hearing '1.5 tons' makes intuition insist only a solid block could hold that much."}}, {"uz": "Son suyagining tashqi qobig‘i hasharotlardagi kabi mustahkam xitin moddasidan tuzilgan", "ru": "Наружный слой бедренной кости состоит из прочного хитина, как у насекомых", "en": "The femur’s outer shell is made of tough chitin like an insect’s exoskeleton", "wrong": {"uz": "Xitin bo‘g‘imoyoqlilar va zamburug‘larda uchraydi; umurtqalilar suyagi kalsiy tuzlari va kollagendan iborat.", "ru": "Хитин характерен для членистоногих и грибов; кости позвоночных состоят из солей кальция и коллагена.", "en": "Chitin belongs to arthropods and fungi; vertebrate bones are built from calcium minerals and collagen."}, "trap": {"uz": "Xitin chindan ham yengil va mustahkam bo‘lgani uchun bu variant ilmiydek eshitiladi.", "ru": "Хитин действительно лёгкий и прочный биоматериал, поэтому вариант звучит наукообразно.", "en": "Chitin really is light and tough in nature, making this sound deceptively scientific."}}, {"uz": "Voyaga yetgan odamda son suyagi asosan yengil tog‘ay to‘qimasidan iborat bo‘lib qoladi", "ru": "У взрослого человека бедренная кость в основном состоит из лёгкой хрящевой ткани", "en": "In adults, the femur remains composed mostly of lightweight cartilage tissue", "wrong": {"uz": "Tog‘ay faqat embrion davrida ustun bo‘ladi; kattalarda u faqat bo‘g‘im yuzalarida yupqa qatlam sifatida saqlanadi.", "ru": "Хрящ преобладает у эмбриона; у взрослого он остаётся лишь тонким слоем на суставных поверхностях.", "en": "Cartilage dominates in embryos; in adults it only caps the smooth joint surfaces."}, "trap": {"uz": "Tog‘ay yengil va elastik ekanligi haqidagi to‘g‘ri fakt bu yerda kattalar suyagiga noto‘g‘ri ko‘chirilgan.", "ru": "Верный факт о лёгкости хряща здесь ошибочно перенесён на всю взрослую кость.", "en": "The true fact that cartilage is light is misapplied here to the entire adult femur."}}]}, {"id": "flw1", "topic": "gul", "q": {"uz": "Gulli o‘simliklarda changlanish va urug‘lanishdan keyin gulning aynan qaysi qismlaridan MEVA va URUG‘ shakllanadi?", "ru": "Из каких именно частей цветка после опыления и оплодотворения формируются ПЛОД и СЕМЯ?", "en": "After pollination and fertilization in flowering plants, which exact parts of the flower become the FRUIT and the SEED?"}, "correctIndex": 0, "correctWhy": {"uz": "Urug‘chining kengaygan pastki qismi — tuguncha devoridan MEVA, tuguncha ichidagi urug‘kurtakdan esa URUG‘ rivojlanadi.", "ru": "Из стенок завязи пестика развивается ПЛОД (околоплодник), а из семязачатка внутри завязи — СЕМЯ.", "en": "The ovary wall develops into the FRUIT, while the ovule inside the ovary develops into the SEED."}, "highlightTrap": {"uz": "Tuguncha va urug‘kurtakning rolini teskari almashtirish yoki gulbargdan meva bo‘ladi deb o‘ylash eng ko‘p uchraydigan xato.", "ru": "Чаще всего путают завязь и семязачаток местами либо думают, что плод вырастает из лепестков.", "en": "Most students swap ovary and ovule or think colorful petals grow into the fruit."}, "options": [{"uz": "Tuguncha devoridan — meva, uning ichidagi urug‘kurtakdan — urug‘", "ru": "Из стенок завязи — плод, а из семязачатка внутри неё — семя", "en": "The ovary wall forms the fruit, and the ovule inside it forms the seed"}, {"uz": "Urug‘kurtakdan — meva, tuguncha devoridan esa — urug‘", "ru": "Из семязачатка — плод, а из стенок завязи — семя", "en": "The ovule forms the fruit, and the ovary wall forms the seed", "wrong": {"uz": "Ichki va tashqi qismlar almashtirib qo‘yilgan: urug‘kurtak urug‘ga, uni o‘ragan tuguncha esa mevaga aylanadi.", "ru": "Всё наоборот: семязачаток даёт семя, а завязь окружает его и становится плодом.", "en": "They’re flipped: the ovule becomes the seed, while the surrounding ovary becomes the fruit."}, "trap": {"uz": "Ikkala so‘z ham urug‘chiga tegishli bo‘lgani uchun shoshilganda o‘rnini adashtirish juda oson.", "ru": "Оба слова относятся к пестику и звучат похоже, поэтому в спешке легко поменять их ролями.", "en": "Both structures belong to the pistil and sound similar, making a swap super easy."}}, {"uz": "Rangli tojbarglar qo‘shilib mevani, chang donachasining o‘zi esa urug‘ni hosil qiladi", "ru": "Яркие лепестки срастаются в плод, а само пыльцевое зерно превращается в семя", "en": "Petals fuse to form the fruit, while the pollen grain itself turns into the seed", "wrong": {"uz": "Urug‘lanishdan keyin tojbarglar so‘lib to‘kiladi; chang donachasi esa faqat erkak jinsiy hujayralarni yetkazadi.", "ru": "После опыления лепестки обычно опадают, а пыльца лишь доставляет мужские гаметы.", "en": "Petals wither and drop off; pollen only delivers male gametes for fertilization."}, "trap": {"uz": "Meva ham, tojbarg ham rangli bo‘lgani uchun biri ikkinchisiga aylanadigandek tuyuladi.", "ru": "И лепестки, и спелые плоды ярко окрашены — мозг невольно связывает их напрямую.", "en": "Because both petals and ripe fruits are colorful, it feels intuitive that petals morph into fruit."}}, {"uz": "Changchi ipi urug‘ga, kosachabarglar esa doim to‘liq mevaga aylanadi", "ru": "Тычинки превращаются в семена, а чашелистики всегда образуют весь плод", "en": "Stamens turn into seeds, and sepals always form the entire fruit", "wrong": {"uz": "Changchilar gullashdan keyin quriydi; kosachabarg ba’zi mevalarda saqlansa ham asosiy meva emas.", "ru": "Тычинки засыхают после цветения, а чашелистики лишь изредка сохраняются у основания плода.", "en": "Stamens wither after pollination; sepals may linger at the base but don’t form the fruit."}, "trap": {"uz": "Olma yoki anor uchida qurigan kosachabarg qoldig‘ini ko‘rish shunday xato fikr berishi mumkin.", "ru": "Остатки чашелистиков на верхушке яблока или граната иногда сбивают с толку.", "en": "Seeing leftover sepals on apples or tomatoes can mislead you into thinking sepals build the fruit."}}, {"uz": "Urug‘chi tumshuqchasi shishib mevaga, gulband esa urug‘ga aylanadi", "ru": "Рыльце пестика разрастается в плод, а цветоножка становится семенем", "en": "The stigma swells into the fruit, while the flower stalk turns into the seed", "wrong": {"uz": "Tumshuqcha faqat changni ushlab qoladi, gulband esa gulni poyaga tutib turuvchi banddir.", "ru": "Рыльце нужно только для улавливания пыльцы, а цветоножка — это просто стебелёк цветка.", "en": "The stigma’s job is catching pollen, and the pedicel is simply the flower stalk."}, "trap": {"uz": "Tumshuqcha ham urug‘chining qismi bo‘lgani uchun uni tuguncha bilan adashtirish mumkin.", "ru": "Рыльце — тоже часть пестика, поэтому его легко спутать с завязью.", "en": "Since the stigma is also part of the pistil, it is easy to mix up with the ovary."}}]}, {"id": "flw2", "topic": "gul", "q": {"uz": "Shamol yordamida changlanadigan o‘simliklarning (makkajo‘xori, bug‘doy, qayin) gullari mayda, ko‘rimsiz, hidsiz va nektarsiz bo‘ladi. Nega bu kamchilik emas, balki evolyutsion ustunlik?", "ru": "Цветки ветроопыляемых растений (кукуруза, пшеница, берёза) мелкие, невзрачные, без запаха и нектара. Почему это не недостаток, а эволюционное преимущество?", "en": "Wind-pollinated plants (corn, wheat, birch) have tiny, dull flowers with no scent or nectar. Why is this an evolutionary advantage rather than a flaw?"}, "correctIndex": 0, "correctWhy": {"uz": "O‘simlik hasharotlarni jalb qilishga behuda energiya sarflamaydi; buning o‘rniga juda ko‘p yengil, quruq chang va patsimon tumshuqcha hosil qiladi.", "ru": "Растение не тратит энергию впустую на привлечение насекомых, а вкладывает ресурсы в огромное количество лёгкой сухой пыльцы и пушистые рыльца.", "en": "The plant saves energy by skipping petals and nectar, investing instead in massive clouds of light, dry pollen and feathery stigmas."}, "highlightTrap": {"uz": "Ko‘pchilik «bunday gullarda changchi va urug‘chi yo‘q» yoki «gulbarg nafas olishga xalaqit beradi» deb chalg‘iydi.", "ru": "Ловушка: думать, что у таких цветков нет тычинок и пестиков или что лепестки мешают растению «дышать».", "en": "Traps include thinking these flowers lack stamens/pistils or that petals stop breathing."}, "options": [{"uz": "Hasharotlarni jalb qilishga energiya isrof qilmay, ko‘p miqdorda yengil chang va tutuvchi tumshuqchalar yaratadi", "ru": "Растение экономит энергию на приманках для насекомых и производит огромное количество лёгкой пыльцы", "en": "They save energy on insect lures and invest in huge quantities of light pollen and feathery stigmas"}, {"uz": "Yorqin tojbarglar shamolni to‘sib qo‘yib, o‘simlikning nafas olishiga yo‘l qo‘ymagan bo‘lar edi", "ru": "Яркие лепестки перекрывали бы ветер и не давали растению дышать", "en": "Bright petals would block the wind and prevent the plant from breathing", "wrong": {"uz": "O‘simliklar gulbarg orqali emas, barglardagi og‘izchalar va poyadagi yasmiqchalar orqali nafas oladi.", "ru": "Растения дышат через устьица листьев и чечевички стебля, а не лепестками.", "en": "Plants breathe through leaf stomata and stem lenticels, not flower petals."}, "trap": {"uz": "Yirik gulbarg haqiqatan ham shamolga to‘siq bo‘lishi mumkin, lekin «nafas olish» qo‘shimchasi uni noto‘g‘ri qiladi.", "ru": "Крупные лепестки и правда мешают ветру сдувать пыльцу, но добавка про «дыхание» делает ответ неверным.", "en": "Big petals can block airflow over anthers, but adding 'prevents breathing' turns it false."}}, {"uz": "Shamol changlatadigan o‘simliklarda changchi va urug‘chi umuman bo‘lmaydi", "ru": "У ветроопыляемых растений вообще отсутствуют тычинки и пестики", "en": "Wind-pollinated plants completely lack stamens and pistils", "wrong": {"uz": "Changchi va urug‘chisiz changlanish mumkin emas! Ularda faqat gulqo‘rg‘on (tojbarg) kichraygan.", "ru": "Без тычинок и пестиков опыление невозможно! У них редуцирован лишь околоцветник.", "en": "Without stamens and pistils, pollination cannot happen! Only the showy petals are reduced."}, "trap": {"uz": "Qayin kuchalasi yoki bug‘doy boshog‘i atirgulga o‘xshamagani uchun ularda gul qismlari yo‘qdek ko‘rinadi.", "ru": "Серёжки берёзы или колос пшеницы не похожи на розу, поэтому кажется, что главных органов цветка там нет.", "en": "Birch catkins and wheat ears don’t look like roses, making it seem like they lack reproductive parts."}}, {"uz": "Nektar va xushbo‘y hid shamol changlatadigan o‘simliklarning changini zaharlab qo‘yadi", "ru": "Нектар и аромат ядовиты для пыльцы ветроопыляемых растений", "en": "Nectar and fragrance are toxic to the pollen of wind-pollinated plants", "wrong": {"uz": "Nektar shakarli eritma bo‘lib, u zaharli emas; shunchaki shamolga nektar kerak emas.", "ru": "Нектар — сладкий раствор, он не ядовит; его просто бессмысленно тратить на ветер.", "en": "Nectar is a harmless sugar solution; plants just don’t waste sugar trying to feed the wind."}, "trap": {"uz": "Yopishqoq nektar quruq changning uchishiga xalaqit berishi «zaharli» so‘zini haqiqatga o‘xshatib qo‘yadi.", "ru": "Мысль о том, что липкий нектар мешает пыльце летать, может ошибочно подтолкнуть к слову «ядовит».", "en": "Knowing sticky nectar hinders dry pollen can make 'toxic' sound vaguely reasonable."}}, {"uz": "Yorqin gullar hasharotlarni chaqirib, ular changlanishdan oldin barcha urug‘larni yeb qo‘ygan bo‘lar edi", "ru": "Яркие цветки привлекли бы насекомых, которые съели бы все семена ещё до опыления", "en": "Bright flowers would attract insects that would eat all the seeds before pollination", "wrong": {"uz": "Changlanish va urug‘lanishdan oldin gulda hali urug‘ning o‘zi mavjud bo‘lmaydi!", "ru": "До опыления и оплодотворения никаких семян в цветке ещё просто не существует!", "en": "Before pollination and fertilization occur, no seeds even exist yet!"}, "trap": {"uz": "Hasharotlar urug‘ yeyishi mumkin, lekin vaqt tartibini (changlanish → urug‘) unutish shu tuzoqqa tushiradi.", "ru": "Насекомые и правда едят семена, но здесь нарушена логика времени: семян до опыления ещё нет.", "en": "Insects do eat seeds, but this option breaks the timeline—seeds only form after pollination."}}]}, {"id": "flw3", "topic": "gul", "q": {"uz": "Makkajo‘xori yoki bodringning bitta tupida faqat changchili gullar bir joyda, faqat urug‘chili gullar esa boshqa joyda joylashgan. Bunday o‘simlik va uning gullari qanday nomlanadi?", "ru": "На одном и том же растении кукурузы или огурца есть цветки только с тычинками и отдельные цветки только с пестиками. Как классифицируют это растение и его цветки?", "en": "On a single corn or cucumber plant, some flowers have ONLY stamens while other flowers have ONLY pistils. How are the plant and its flowers classified?"}, "correctIndex": 0, "correctWhy": {"uz": "Har bir gulda faqat bitta jins bo‘lgani uchun gullar BIR JINSLI; ikkala turdagi gul ham bitta o‘simlik (bitta «uy»)da joylashgani uchun o‘simlik BIR UYLI deyiladi.", "ru": "Каждый цветок содержит органы только одного пола — цветки РАЗДЕЛЬНОПОЛЫЕ (однополые). Но оба типа живут на одном растении («в одном доме») — растение ОДНОДОМНОЕ.", "en": "Each flower has one sex (unisexual flowers), and both live on the same plant ('one house' = monoecious)."}, "highlightTrap": {"uz": "«Ikki xil gul bor — demak ikki uyli» deb o‘ylash 7-sinfdagi eng mashhur xato! «Ikki uyli» (tol, terak) ikkita alohida daraxtda deganidir.", "ru": "Знаменитая ловушка 7 класса: принять «два вида цветков» за «двудомное растение». Двудомные (ива, тополь) — на двух РАЗНЫХ растениях!", "en": "Famous trap: seeing 'two flower types' and picking dioecious. Dioecious means male and female flowers live on two separate plants."}, "options": [{"uz": "Bir uyli o‘simlik, gullari esa bir jinsli", "ru": "Однодомное растение с раздельнополыми (однополыми) цветками", "en": "A monoecious plant with unisexual flowers"}, {"uz": "Ikki uyli o‘simlik, chunki unda ikki xil turdagi gul mavjud", "ru": "Двудомное растение, так как на нём есть два разных типа цветков", "en": "A dioecious plant, because it has two different types of flowers", "wrong": {"uz": "«Uy» so‘zi gulni emas, butun o‘simlik tupini bildiradi. Bitta tupda ikkala jins ham bo‘lsa — u «bir uyli».", "ru": "«Дом» — это само растение, а не цветок. Если мужские и женские цветки на одном растении, оно однодомное.", "en": "'House' refers to the plant, not the flower. Both sexes on one plant means monoecious."}, "trap": {"uz": "«Ikki xil gul» iborasidagi «ikki» soni avtomatik ravishda «ikki uyli» atamasiga tortib ketadi.", "ru": "Слово «два типа» в условии подсознательно притягивает слово «двудомное».", "en": "Hearing 'two types of flowers' subconsciously pulls you toward 'dioecious'."}}, {"uz": "Ikki jinsli gulli o‘simlik, chunki o‘simlikda changchi ham, urug‘chi ham bor", "ru": "Растение с обоеполыми цветками, ведь у него есть и тычинки, и пестики", "en": "A plant with bisexual flowers, since both stamens and pistils exist on the plant", "wrong": {"uz": "Ikki jinsli gulda changchi ham, urug‘chi ham BITTA gulning ichida (olma, lolada) bo‘ladi.", "ru": "Обоеполый цветок содержит и тычинки, и пестик внутри ОДНОГО цветка (как у яблони или тюльпана).", "en": "Bisexual flowers have both stamens and pistils inside the SAME individual flower."}, "trap": {"uz": "Butun o‘simlik xususiyatini bitta gulning xususiyati bilan aralashtirish juda oson xato.", "ru": "Легко перенести признак всего растения целиком на каждый отдельный цветок.", "en": "It’s easy to confuse a trait of the whole plant with a trait of each individual flower."}}, {"uz": "Jinssiz (steril) o‘simlik, shuning uchun u faqat ildiz orqali ko‘payadi", "ru": "Бесполое (стерильное) растение, размножающееся только корнями", "en": "A sterile plant that can only reproduce through its roots", "wrong": {"uz": "Bir jinsli gullar to‘laqonli jinsiy ko‘payadi — makkajo‘xori va bodring mo‘l urug‘ beradi.", "ru": "Раздельнополые цветки прекрасно размножаются половым путём — кукуруза и огурцы дают массу семян.", "en": "Unisexual flowers reproduce sexually just fine—corn and cucumbers produce tons of seeds."}, "trap": {"uz": "Gulda qismlardan biri yo‘qligini eshitib, uni nuqsonli yoki «steril» deb o‘ylash mumkin.", "ru": "Отсутствие части органов в цветке иногда ошибочно воспринимают как бесплодие.", "en": "Hearing a flower is missing stamens or pistils can mislead people into thinking it’s sterile."}}, {"uz": "Ochiq urug‘li o‘simlik, chunki uning jinsiy organlari alohida joylashgan", "ru": "Голосеменное растение, потому что его половые органы разделены", "en": "A gymnosperm, because its reproductive structures are separated", "wrong": {"uz": "Ochiq urug‘lilarda (qarag‘ay, archa) umuman gul va meva bo‘lmaydi, ularda qubba bo‘ladi.", "ru": "У голосеменных (сосна, ель) вообще нет цветков и плодов — у них шишки.", "en": "Gymnosperms like pines don’t have true flowers or fruits—they have cones."}, "trap": {"uz": "Qarag‘ayda ham erkak va urg‘ochi qubbalar bir daraxtda alohida turishi bu variantni chalg‘ituvchi qiladi.", "ru": "У сосны мужские и женские шишки тоже разделены на одном дереве — отсюда и ловушка.", "en": "Pines also separate male and female cones on one tree, creating a clever look-alike trap."}}]}, {"id": "adp1", "topic": "moslanish", "q": {"uz": "Cho‘l kaktuslarining barglari o‘tkir tikanlarga aylangan, poyasi esa qalin va yashil bo‘ladi. Bu moslanishning IKKALA asosiy vazifasini to‘g‘ri ko‘rsatgan javob qaysi?", "ru": "У пустынных кактусов листья превратились в колючки, а стебель стал толстым и зелёным. Какой ответ точно раскрывает ОБЕ функции этого приспособления?", "en": "Desert cacti have leaves reduced to sharp spines and thick green stems. Which answer accurately captures BOTH functions of this adaptation?"}, "correctIndex": 0, "correctWhy": {"uz": "Tikanlar suv bug‘lanishini keskin kamaytiradi va o‘txo‘r hayvonlardan himoya qiladi; etli yashil poya esa suv zaxiralaydi va barg o‘rniga fotosintez qiladi.", "ru": "Колючки резко снижают испарение воды и защищают от животных, а мясистый зелёный стебель запасает влагу и берёт на себя фотосинтез.", "en": "Spines minimize water loss and deter herbivores, while the fleshy green stem stores water and performs photosynthesis."}, "highlightTrap": {"uz": "Ko‘pchilik fotosintezni baribir tikanlar bajaradi yoki tikanlar yomg‘ir suvini so‘rib oladi deb adashadi.", "ru": "Многие считают, что фотосинтез всё равно идёт в листьях-колючках или что колючки всасывают воду.", "en": "Many mistakenly think leaf-spines still photosynthesize or directly drink rainwater."}, "options": [{"uz": "Tikanlar suv bug‘lanishini kamaytirib himoya qiladi, yashil poya esa suv saqlaydi va fotosintez bajaradi", "ru": "Колючки уменьшают испарение и защищают, а зелёный стебель запасает воду и фотосинтезирует", "en": "Spines reduce water loss and deter herbivores; the green stem stores water and photosynthesizes"}, {"uz": "Tikanlar kuchli fotosintez qiladi, qalin poya esa faqat tikanlarni ko‘tarib turadi", "ru": "Колючки ведут активный фотосинтез, а толстый стебель служит лишь опорой для них", "en": "Spines perform intense photosynthesis while the thick stem simply supports them", "wrong": {"uz": "Tikanlarda xlorofill va yetarli yuza yo‘q — fotosintezni aynan xlorofillga boy yashil poya bajaradi.", "ru": "В сухих колючках нет хлорофилла — фотосинтез целиком перешёл к зелёному стеблю.", "en": "Dry spines lack chlorophyll; the chlorophyll-rich green stem performs photosynthesis."}, "trap": {"uz": "«Tikan = shakli o‘zgargan barg, barg esa fotosintez qiladi» degan mexanik zanjir bu xatoga olib keladi.", "ru": "Механическая логика «колючка = лист, а лист фотосинтезирует» часто срабатывает как ловушка.", "en": "Mechanical logic ('spines are leaves, leaves photosynthesize') leads straight into this trap."}}, {"uz": "Tikanlar yomg‘ir suvini ichkariga so‘rib oladi, poya esa quyosh nurini ichkariga o‘tkazmaydi", "ru": "Колючки напрямую всасывают дождевую воду, а стебель блокирует солнечный свет", "en": "Spines absorb rainwater directly while the stem blocks out sunlight", "wrong": {"uz": "Suvni kaktusning keng ildiz tizimi so‘rib oladi; tikanlar faqat shudringni ildiz tomon oqizishi mumkin.", "ru": "Воду всасывают корни (колючки могут лишь собирать конденсат, стекающий в почву).", "en": "Roots absorb water; spines only help shade the stem or drip dew onto the soil."}, "trap": {"uz": "Kaktus tikanlarida shudring to‘planishi haqidagi fakt «tikan suv ichadi» degan xato tasavvur uyg‘otadi.", "ru": "Факт о сборе росы на колючках создаёт ложную мысль, будто они сами её всасывают.", "en": "Hearing dew condenses on spines makes it sound like spines actually drink water."}}, {"uz": "Kaktuslar faqat qishki sovuqdan saqlanish uchun barglarini tikan qilib to‘kadi", "ru": "Кактусы превращают листья в колючки только зимой для защиты от морозов", "en": "Cacti turn their leaves into spines only in winter to survive freezing cold", "wrong": {"uz": "Barg to‘kish mo‘tadil iqlim daraxtlariga xos; kaktus tikanlari esa yil bo‘yi qurg‘oqchilikka moslanishdir.", "ru": "Сезонный листопад характерен для деревьев умеренного климата, а у кактуса колючки постоянны.", "en": "Seasonal leaf-drop is for temperate trees; cactus spines are permanent drought adaptations."}, "trap": {"uz": "Bargni yo‘qotish suv tejashga yordam berishi ikkala holatda ham umumiy bo‘lgani uchun chalkashlik yuzaga keladi.", "ru": "Оба механизма (листопад и колючки) экономят воду, поэтому их легко перепутать по условиям среды.", "en": "Both leaf-drop and spines conserve water, making swapping their climates easy."}}, {"uz": "Tikanlar issiqlikni to‘liq qaytargani uchun kaktusga tirik qolish uchun umuman suv kerak emas", "ru": "Колючки полностью отражают жару, поэтому кактусу вообще не нужна вода для жизни", "en": "Spines reflect all heat so cacti need zero water to stay alive", "wrong": {"uz": "Suvsiz hech bir tirik organizm yashay olmaydi — kaktus suvga muhtoj, shunchaki uni tejamkor sarflaydi.", "ru": "Без воды не живёт ни один организм — кактус просто мастерски её запасает и экономит.", "en": "No living organism survives without water; cacti simply store and conserve it brilliantly."}, "trap": {"uz": "Kaktusning uzoq suvsiz turishi haqidagi gaplar uni «suv kerak emas» degan mubolag‘aga aylantiradi.", "ru": "Стойкость кактусов к засухе в быту часто преувеличивают до «им вода не нужна».", "en": "Cacti are so drought-hardy that people exaggerate it into thinking they need no water."}}]}, {"id": "adp2", "topic": "moslanish", "q": {"uz": "Zaharli bo‘lmagan gulchivin (pashsha turi)ning tanasi chaquvchi arinikidek yorqin sariq-qora chiziqli bo‘ladi. Bu qanday moslanish va nega uni oddiy «himoya rangi» deb atab bo‘lmaydi?", "ru": "Безобидная муха-журчалка имеет яркие жёлто-чёрные полосы, почти как у жалящей осы. Что это за приспособление и почему его нельзя назвать обычной покровительственной окраской?", "en": "A harmless hoverfly wears bright yellow-and-black stripes almost identical to a stinging wasp. What adaptation is this, and why is it NOT simple camouflage?"}, "correctIndex": 0, "correctWhy": {"uz": "Bu — MIMIKRIYA (himoyasiz turning xavfli turga taqlid qilishi). Himoya rangi hayvonni muhitda yashiradi, mimikriya esa yirtqichni qo‘rqitish uchun ko‘zga tashlanadi.", "ru": "Это МИМИКРИЯ — подражание беззащитного вида опасному. Покровительственная окраска прячет животное, а мимикрия намеренно заметна, чтобы отпугнуть хищника.", "en": "It is MIMICRY — a harmless species copying a dangerous one. Camouflage hides an animal, while mimicry stands out to bluff predators."}, "highlightTrap": {"uz": "Eng nozik tuzoq — «ogohlantiruvchi rang» bilan adashtirish! U ari uchun to‘g‘ri (u rostdan zaharli), zararsiz gulchivinda esa bu mimikriya.", "ru": "Тончайшая ловушка — перепутать с предупреждающей окраской! У самой осы она предупреждающая (она жалит), а у мухи это обман — мимикрия.", "en": "The sharpest trap is warning coloration: the wasp has true warning coloration, while the harmless fly is faking it (mimicry)."}, "options": [{"uz": "Bu mimikriya (xavfli turga taqlid); himoya rangi esa hayvonni atrof-muhit fonida yashiradi", "ru": "Это мимикрия (подражание опасному виду), тогда как покровительственная окраска маскирует под фон среды", "en": "It is mimicry (copying a dangerous species), whereas camouflage hides an animal against its background"}, {"uz": "Bu ogohlantiruvchi rang, chunki gulchivin ham qushlarga zaharli ekanini bildiradi", "ru": "Это предупреждающая окраска, так как муха-журчалка тоже ядовита для птиц", "en": "It is warning coloration, because the hoverfly is also venomous to birds", "wrong": {"uz": "Gulchivin zaharli EMAS! Haqiqiy ogohlantiruvchi rang faqat chindan xavfli turlarda (ari, xonqizi) bo‘ladi.", "ru": "По условию муха безобидна! Предупреждающей окраской обладают реально опасные виды (оса), а не их двойники.", "en": "The hoverfly is harmless! True warning coloration belongs to genuinely dangerous species like wasps."}, "trap": {"uz": "Sariq-qora rang biologiyada ogohlantiruvchi rang sifatida tanilgani uchun qo‘l darhol shu javobga tortadi.", "ru": "Жёлто-чёрные полосы — хрестоматийный пример предупреждающей окраски, поэтому вариант кажется верным.", "en": "Yellow-and-black stripes are the classic symbol of warning coloration, making this hugely tempting."}}, {"uz": "Bu maskirovka (yashirinish rangi), chunki sariq-qora chiziqlar yashil bargda ko‘rinmay qoladi", "ru": "Это маскировка, потому что жёлто-чёрные полосы делают муху невидимой на зелёных листьях", "en": "It is camouflage, because yellow-and-black stripes make it invisible on green leaves", "wrong": {"uz": "Sariq-qora rang yashil barg fonida yashirinmaydi, aksincha juda yorqin ajralib turadi.", "ru": "Яркие жёлто-чёрные полосы на зелёном листе не прячут, а наоборот — бросаются в глаза.", "en": "Bright yellow and black starkly contrast against green leaves instead of blending in."}, "trap": {"uz": "Yo‘lbars chiziqlari maskirovka ekanini eslab, hamma chiziqli ranglarni maskirovka deb o‘ylash mumkin.", "ru": "Помня, что полосы тигра служат маскировкой, легко перенести это правило на полосы мухи.", "en": "Remembering tiger stripes act as camouflage makes it easy to assume all stripes camouflage."}}, {"uz": "Bu mavsumiy tullash bo‘lib, gulchivin faqat yozda ari rangiga kiradi", "ru": "Это сезонная линька, при которой муха становится похожей на осу только летом", "en": "It is seasonal molting, where the fly only develops wasp stripes in summer", "wrong": {"uz": "Gulchivinning chiziqlari genetik jihatdan doimiy belgi bo‘lib, mavsumga qarab o‘zgarmaydi.", "ru": "Окраска журчалки постоянна на всю взрослую жизнь и не меняется по сезонам.", "en": "Hoverfly stripes are permanent throughout adulthood, not a seasonal color swap."}, "trap": {"uz": "Oq quyonning qishda rang o‘zgartirishi (mavsumiy moslanish) bilan aralashtirish oson.", "ru": "Здесь использован реальный термин сезонной смены окраски (как у зайца-беляка), чтобы сбить с толку.", "en": "Real seasonal adaptations (like arctic hares turning white) were borrowed here as a distraction."}}, {"uz": "Bu fiziologik moslanish, chunki gulchivin ari kabi asal ishlab chiqaradi", "ru": "Это физиологическое приспособление, ведь муха вырабатывает мёд, как пчела", "en": "It is a physiological adaptation, because hoverflies make honey like bees", "wrong": {"uz": "Tashqi ko‘rinish va rang — morfologik moslanishdir; gulchivinlar asal ishlab chiqarmaydi.", "ru": "Внешний вид и окраска — это морфологическое приспособление, а мёд журчалки не производят.", "en": "Body pattern is a morphological adaptation, and hoverflies do not make honey."}, "trap": {"uz": "Gulchivinlar gullarga qo‘nib nektar yig‘ishi ularni asalari bilan adashtirib qo‘yishi mumkin.", "ru": "Журчалки часто сидят на цветах, из-за чего их легко перепутать с пчёлами.", "en": "Hoverflies hover around flowers feeding on nectar, making people confuse them with honeybees."}}]}, {"id": "adp3", "topic": "moslanish", "q": {"uz": "Shimoliy qutbda yashovchi qutb tulkisi va oq ayiqning quloqlari hamda dumi juda kichik, issiq sahroda yashovchi fenek tulkisining quloqlari esa bahaybat bo‘ladi. Bu farqning asosiy biologik sababi nima?", "ru": "У полярных животных (песец, белый медведь) уши и хвост очень маленькие, а у пустынной лисицы фенека — огромные. В чём главная биологическая причина?", "en": "Arctic mammals (Arctic fox, polar bear) have tiny ears and short tails, whereas the desert fennec fox has gigantic ears. What is the main biological reason?"}, "correctIndex": 0, "correctWhy": {"uz": "Bu issiqlik almashinuvi (Allen qoidasi) bilan bog‘liq: sovuqda kichik quloqlar issiqlik yo‘qotishni kamaytiradi, sahroda esa katta quloqlardagi qon tomirlari ortiqcha issiqlikni chiqarib tanani sovutadi.", "ru": "Дело в терморегуляции (правило Аллена): на морозе малая площадь ушей бережёт тепло, а в пустыне огромные уши с сетью сосудов работают как радиатор, охлаждая кровь.", "en": "It’s thermoregulation (Allen’s rule): small extremities conserve heat in cold, while huge vascular desert ears act like radiators to dump excess heat."}, "highlightTrap": {"uz": "Ko‘pchilik buni faqat eshitish qobiliyati bilan bog‘laydi yoki sahro tulkisi qulog‘i bilan shudring yig‘adi deb o‘ylaydi.", "ru": "Главная ловушка — объяснить размер ушей только остротой слуха или решить, что в Арктике нечего слушать.", "en": "Most students tie ear size solely to hearing or think freezing air physically shrinks ears."}, "options": [{"uz": "Kichik quloqlar sovuqda issiqlik yo‘qotishni kamaytiradi, katta quloqlar esa issiqda tanani sovutishga yordam beradi", "ru": "Маленькие уши снижают потерю тепла на морозе, а огромные в жаре отдают лишнее тепло, охлаждая тело", "en": "Small ears minimize heat loss in cold climates, while huge ears radiate excess heat to cool the body"}, {"uz": "Qor barcha tovushlarni yutib yuborgani uchun qutb hayvonlariga yaxshi eshitish kerak emas", "ru": "Снег поглощает звуки, поэтому полярным хищникам не нужен острый слух", "en": "Snow absorbs all sound, so Arctic predators have no need for sharp hearing", "wrong": {"uz": "Qutb tulkisining eshitish qobiliyati nihoyatda o‘tkir — u qalin qor ostidagi sichqonni bemalol eshitib ovlaydi!", "ru": "У песца потрясающий слух: он безошибочно слышит леммингов прямо под толстым слоем снега!", "en": "Arctic foxes have razor-sharp hearing—they hunt lemmings moving deep beneath thick snow!"}, "trap": {"uz": "Quloqning asosiy vazifasi eshitish bo‘lgani uchun kichik quloq = yomon eshitish degan mantiq birinchi keladi.", "ru": "Раз уши нужны для слуха, мозг первым делом связывает их размер со слухом, забывая о теплообмене.", "en": "Because ears are for hearing, intuition jumps straight to hearing and overlooks heat exchange."}}, {"uz": "Fenek tulkisi katta quloqlari yordamida ertalabki shudring tomchilarini yig‘ib ichadi", "ru": "Лисица фенек использует огромные уши, чтобы собирать утреннюю росу для питья", "en": "The fennec fox uses its huge ears primarily as funnels to collect morning dew for drinking", "wrong": {"uz": "Fenek suvni asosan o‘ljasi va o‘simliklardan oladi; quloqlari esa sovutgich (radiator) vazifasini bajaradi.", "ru": "Воду фенек получает из пищи, а уши служат для охлаждения крови и тонкого слуха.", "en": "Fennecs get moisture from food; their ears act primarily as blood-cooling radiators."}, "trap": {"uz": "Sahroda suv muammosi eng katta muammo bo‘lgani uchun har qanday belgini suv ichishga bog‘lash oson.", "ru": "В пустыне вода — главная ценность, поэтому любая необычная деталь тела кажется инструментом для её сбора.", "en": "Since water is scarce in deserts, any unusual body part sounds plausible as a water-catching tool."}}, {"uz": "Qattiq sovuq havo tog‘ayni muzlatib qo‘ygani uchun qutb hayvonlarining quloqlari qishda kichrayib qoladi", "ru": "Из-за сильного мороза хрящи сжимаются, поэтому уши полярных животных физически уменьшаются зимой", "en": "Freezing air shrinks cartilage, causing Arctic animals’ ears to physically contract every winter", "wrong": {"uz": "Bu sovuqdan jismoniy kichrayish emas, balki tabiiy tanlanish orqali mustahkamlangan irsiy moslanishdir.", "ru": "Это не сжатие от холода, а наследственное эволюционное приспособление за тысячи поколений.", "en": "It isn’t physical shrinkage from cold—it’s an inherited evolutionary adaptation."}, "trap": {"uz": "Fizikadan «jismlar sovuqda torayadi» qonuni bu biologik xatoni haqiqatga o‘xshatib qo‘yadi.", "ru": "Закон физики о сжатии тел при охлаждении делает эту выдумку неожиданно правдоподобной.", "en": "Physics teaches materials contract when cold, making this biological myth sound convincing."}}, {"uz": "Kichik quloqlar suv ostida tezroq suzish uchun qutb tulkisining asosiy moslanishidir", "ru": "Маленькие уши нужны песцу прежде всего для быстрого плавания под водой", "en": "Small ears evolved in Arctic foxes primarily to help them swim faster underwater", "wrong": {"uz": "Qutb tulkisi suv ostida ov qiluvchi hayvon emas (tyulen kabi); u quruqlikda va muz ustida yashaydi.", "ru": "Песец — сухопутный хищник, а не подводный пловец вроде тюленя.", "en": "Arctic foxes are land predators, not underwater swimmers like seals."}, "trap": {"uz": "Savolda oq ayiq ham tilga olingani (u yaxshi suzadi) bu variantni qisman to‘g‘ridek ko‘rsatadi.", "ru": "Упоминание белого медведя (который отлично плавает) маскирует ложность этого варианта для песца.", "en": "Mentioning polar bears (which swim well) makes this underwater explanation look partially right."}}]}];
