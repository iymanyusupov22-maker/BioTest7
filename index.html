<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioTest 7 — Interaktiv Biologiya Testi</title>
  <style>
    :root {
      --bg-base: #f8fafc;
      --bg-blob-1: rgba(56, 189, 248, 0.16);
      --bg-blob-2: rgba(168, 85, 247, 0.13);
      --bg-blob-3: rgba(16, 185, 129, 0.12);
      --surface: rgba(255, 255, 255, 0.94);
      --surface-solid: #ffffff;
      --surface-hover: #f1f5f9;
      --border: rgba(15, 23, 42, 0.09);
      --border-strong: rgba(15, 23, 42, 0.16);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --accent-glow: rgba(37, 99, 235, 0.25);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.11);
      --warning: #d97706;
      --warning-bg: rgba(245, 158, 11, 0.13);
      --shadow-card: 0 20px 50px -15px rgba(15, 23, 42, 0.08), 0 4px 14px -2px rgba(15, 23, 42, 0.04);
      --shadow-btn: 0 8px 20px -6px rgba(37, 99, 235, 0.35);
      --radius-lg: 26px;
      --radius-md: 16px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="dark"] {
      --bg-base: #070b14;
      --bg-blob-1: rgba(56, 189, 248, 0.16);
      --bg-blob-2: rgba(139, 92, 246, 0.18);
      --bg-blob-3: rgba(16, 185, 129, 0.12);
      --surface: rgba(15, 23, 42, 0.88);
      --surface-solid: #111827;
      --surface-hover: rgba(30, 41, 59, 0.92);
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.16);
      --accent-glow: rgba(96, 165, 250, 0.3);
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --shadow-card: 0 24px 60px -15px rgba(0, 0, 0, 0.65);
      --shadow-btn: 0 10px 24px -6px rgba(96, 165, 250, 0.35);
    }

    [data-theme="rainbow"] {
      --bg-base: #ffffff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: rgba(255, 255, 255, 0.96);
      --surface-hover: rgba(255, 255, 255, 0.99);
      --border: rgba(255, 255, 255, 0.75);
      --border-strong: rgba(168, 85, 247, 0.35);
      --text-main: #18181b;
      --text-muted: #52525b;
      --accent: #9333ea;
      --accent-soft: rgba(147, 51, 234, 0.12);
      --accent-glow: rgba(236, 72, 153, 0.3);
      --success: #059669;
      --success-bg: rgba(16, 185, 129, 0.16);
      --danger: #e11d48;
      --danger-bg: rgba(225, 29, 72, 0.13);
      --warning: #b45309;
      --warning-bg: rgba(245, 158, 11, 0.18);
      --shadow-card: 0 24px 60px -15px rgba(147, 51, 234, 0.22);
      --shadow-btn: 0 10px 26px -6px rgba(236, 72, 153, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      background-color: var(--bg-base);
      color: #0f172a;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.5s var(--ease), color 0.35s var(--ease);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
      position: relative;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: floatBlob 18s ease-in-out infinite alternate;
    }

    .blob-1 { width: 460px; height: 460px; top: -120px; left: -80px; background: var(--bg-blob-1); }
    .blob-2 { width: 420px; height: 420px; bottom: -110px; right: -80px; background: var(--bg-blob-2); animation-delay: -6s; }
    .blob-3 { width: 340px; height: 340px; top: 40%; left: 55%; background: var(--bg-blob-3); animation-delay: -11s; }

    .rainbow-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(125deg, #ff9a9e 0%, #fad0c4 14%, #fbc2eb 28%, #a18cd1 42%, #8fd3f4 58%, #84fab0 74%, #fddb92 88%, #ff9a9e 100%);
      background-size: 300% 300%;
      animation: rainbowFlow 14s ease infinite;
      transition: opacity 0.6s var(--ease);
    }

    [data-theme="rainbow"] .rainbow-bg { opacity: 1; }
    [data-theme="rainbow"] .bg-layer { opacity: 0; }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, -25px) scale(1.08); }
      100% { transform: translate(-25px, 30px) scale(0.95); }
    }

    @keyframes rainbowFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-shell {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: #ffffff;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 16px;
      box-shadow: var(--shadow-card);
      transition: background 0.4s var(--ease), border-color 0.4s var(--ease);
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 19px;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      color: #fff;
      box-shadow: 0 8px 18px -6px var(--accent-glow);
      transition: transform 0.35s var(--ease);
    }

    [data-theme="rainbow"] .brand-icon { background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4); }
    .brand:hover .brand-icon { transform: rotate(-8deg) scale(1.06); }
    .brand-text h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
    .brand-text span { font-size: 0.76rem; font-weight: 600; color: var(--text-muted); }

    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .lang-group {
      display: flex;
      background: var(--surface-hover);
      padding: 4px;
      border-radius: 13px;
      border: 1px solid var(--border);
      gap: 3px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }

    .lang-btn:hover { color: var(--text-main); }
    .lang-btn.active { background: var(--surface-solid); color: var(--accent); box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08); }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface-solid);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 13px;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .theme-btn:hover { transform: translateY(-2px); border-color: var(--accent); }
    .theme-btn:active { transform: scale(0.96); }

    .theme-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
    }

    [data-theme="light"] .theme-dot { background: linear-gradient(135deg, #ffffff, #cbd5e1); }
    [data-theme="dark"] .theme-dot { background: linear-gradient(135deg, #1e293b, #60a5fa); border-color: rgba(255, 255, 255, 0.3); }
    [data-theme="rainbow"] .theme-dot {
      background: conic-gradient(#ff4d4d, #f59e0b, #10b981, #3b82f6, #a855f7, #ec4899, #ff4d4d);
      border-color: #fff;
      animation: spinSlow 4s linear infinite;
    }

    @keyframes spinSlow { to { transform: rotate(360deg); } }

    .card {
      background: #ffffff;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow-card);
      transition: background 0.45s var(--ease), border-color 0.45s var(--ease);
      position: relative;
      overflow: hidden;
    }

    [data-theme="rainbow"] .card { border: 1.5px solid rgba(255, 255, 255, 0.85); }

    .js-warning {
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--warning-bg);
      color: var(--text-main);
      border: 1px solid var(--warning);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .quiz-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .topic-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .step-counter { font-size: 0.86rem; font-weight: 700; color: var(--text-muted); }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface-hover);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      width: 14%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #06b6d4);
      transition: width 0.5s var(--ease);
    }

    [data-theme="rainbow"] .progress-fill { background: linear-gradient(90deg, #ec4899, #8b5cf6, #06b6d4, #10b981); }

    /* Smooth slide animation WITHOUT ever hiding elements at opacity: 0 */
    .stage-anim {
      animation: stagePop 0.36s var(--ease);
    }

    @keyframes stagePop {
      from { transform: translateY(12px); }
      to { transform: translateY(0); }
    }

    .question-text {
      font-size: 1.22rem;
      font-weight: 800;
      line-height: 1.45;
      letter-spacing: -0.02em;
      margin-bottom: 22px;
      color: var(--text-main);
      opacity: 1;
    }

    .options-list { display: flex; flex-direction: column; gap: 11px; }

    .option-btn {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 15px 18px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface-solid);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      line-height: 1.42;
      cursor: pointer;
      opacity: 1;
      transition: transform 0.25s var(--ease), border-color 0.25s var(--ease), background-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    .option-btn:hover { border-color: var(--accent); background: var(--surface-hover); transform: translateX(4px); }
    .option-btn.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); transform: translateX(4px); }

    .option-letter {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 0.82rem;
      font-weight: 800;
      background: var(--surface-hover);
      color: var(--text-muted);
      border: 1px solid var(--border);
      transition: all 0.25s var(--ease);
      margin-top: -1px;
    }

    .option-btn.selected .option-letter { background: var(--accent); color: #fff; border-color: transparent; }

    .actions {
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s var(--ease);
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #0284c7); color: #fff; box-shadow: var(--shadow-btn); }
    [data-theme="rainbow"] .btn-primary { background: linear-gradient(135deg, #9333ea, #ec4899); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.06); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; transform: none; }

    .btn-ghost { background: var(--surface-hover); color: var(--text-main); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
    .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }

    .result-hero {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .score-ring { position: relative; width: 112px; height: 112px; flex-shrink: 0; }
    .score-ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--surface-hover); stroke-width: 10; }
    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 289;
      stroke-dashoffset: 289;
      transition: stroke-dashoffset 0.9s var(--ease);
    }

    .score-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-center strong { font-size: 1.55rem; font-weight: 800; line-height: 1; }
    .score-center small { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-top: 3px; }
    .result-summary { flex: 1; min-width: 220px; }
    .result-summary h2 { font-size: 1.45rem; font-weight: 800; margin-bottom: 6px; }
    .result-summary p { color: var(--text-muted); font-size: 0.94rem; line-height: 1.5; }

    .review-nav-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .nav-pill {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 2px solid transparent;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s var(--ease);
      display: grid;
      place-items: center;
    }

    .nav-pill.correct { background: var(--success-bg); color: var(--success); }
    .nav-pill.wrong { background: var(--danger-bg); color: var(--danger); }
    .nav-pill.active { border-color: var(--text-main); transform: translateY(-2px) scale(1.06); }

    .review-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 15px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface-solid);
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 9px;
    }

    .review-option.is-correct { border-color: var(--success); background: var(--success-bg); }
    .review-option.is-wrong-pick { border-color: var(--danger); background: var(--danger-bg); }
    .review-option.dimmed { opacity: 0.65; }

    .review-badge {
      margin-left: auto;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 8px;
      white-space: nowrap;
      align-self: center;
    }

    .badge-ok { background: var(--success); color: #fff; }
    .badge-err { background: var(--danger); color: #fff; }

    .checker-panel { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
    .checker-box {
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid var(--border);
      line-height: 1.55;
      font-size: 0.92rem;
    }

    .checker-box-title {
      font-size: 0.84rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }

    .box-wrong { background: var(--danger-bg); border-color: rgba(239, 68, 68, 0.25); }
    .box-wrong .checker-box-title { color: var(--danger); }
    .box-trap { background: var(--warning-bg); border-color: rgba(245, 158, 11, 0.28); }
    .box-trap .checker-box-title { color: var(--warning); }
    .box-correct { background: var(--success-bg); border-color: rgba(16, 185, 129, 0.28); }
    .box-correct .checker-box-title { color: var(--success); }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .card { padding: 22px 18px; border-radius: 22px; }
      .question-text { font-size: 1.08rem; }
      .option-btn { padding: 13px 14px; font-size: 0.91rem; }
      .topbar { padding: 10px 12px; }
      .result-hero { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="rainbow-bg"></div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🧬</div>
        <div class="brand-text">
          <h1 id="uiTitle">BioTest 7</h1>
          <span id="uiSubtitle">7-sinf • Chuqurlashtirilgan test</span>
        </div>
      </div>

      <div class="controls">
        <div class="lang-group" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="uz">UZ</button>
          <button type="button" class="lang-btn" data-lang="ru">RU</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="theme-btn" id="themeToggle" type="button">
          <span class="theme-dot"></span>
          <span id="themeLabel">Oq mavzu</span>
        </button>
      </div>
    </header>

    <main class="card" id="quizView">
      <div class="js-warning" id="jsWarning">
        ⚠️ <b>JavaScript o‘chiq!</b> Agar siz bu faylni telefonning oddiy HTML ko‘ruvchisida ochgan bo‘lsangiz, test ishlamaydi. Faylni <b>Google Chrome</b> brauzerida yoki <b>GitHub Pages</b> orqali oching.
      </div>

      <div class="quiz-meta">
        <span class="topic-pill" id="topicBadge">🦠 Bakteriyalar</span>
        <span class="step-counter" id="stepCounter">1 / 7</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div id="questionStage">
        <h2 class="question-text" id="questionText"></h2>
        <div class="options-list" id="optionsList"></div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="prevBtn" type="button">← Orqaga</button>
        <button class="btn btn-primary" id="nextBtn" type="button" disabled>Keyingi savol →</button>
      </div>
    </main>

    <section class="card hidden" id="reviewView">
      <div class="result-hero">
        <div class="score-ring">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="46"></circle>
            <circle class="ring-progress" id="ringProgress" cx="50" cy="50" r="46"></circle>
          </svg>
          <div class="score-center">
            <strong id="scoreFraction">0/7</strong>
            <small id="scorePercent">0%</small>
          </div>
        </div>
        <div class="result-summary">
          <h2 id="resultHeading">Natija</h2>
          <p id="resultSubtext"></p>
        </div>
      </div>

      <div class="quiz-meta" style="margin-bottom: 12px;">
        <span class="topic-pill" id="reviewHeaderPill">Birgalikda tekshiramiz</span>
        <span class="step-counter" id="reviewStepCounter">1 / 7</span>
      </div>

      <div class="review-nav-pills" id="reviewNavPills"></div>
      <div id="reviewStage"></div>

      <div class="actions">
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-ghost" id="reviewPrevBtn" type="button">←</button>
          <button class="btn btn-ghost" id="reviewNextBtn" type="button">→</button>
        </div>
        <button class="btn btn-primary" id="restartBtn" type="button">↻ Yangi test (boshqa savollar)</button>
      </div>
    </section>
  </div>

  <script>
    (function () {
      function initApp() {
        var jsWarn = document.getElementById("jsWarning");
        if (jsWarn) jsWarn.style.display = "none";

        try {
          var LETTERS = ["A", "B", "C", "D", "E"];
          var QUESTIONS_PER_TEST = 7;
